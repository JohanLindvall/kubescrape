name: Feature request
description: Describe a use case or improvement you would like to see.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem you want to solve. Search existing issues for related requests;
        the [comparison](https://github.com/JohanLindvall/kubescrape/blob/main/docs/COMPARISON.md)
        and [scope](https://github.com/JohanLindvall/kubescrape#out-of-scope) may help frame the request.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to achieve, who would benefit, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired behavior
      description: Describe a concrete example of what success would look like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
      description: Existing configuration, workarounds or other approaches you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Relevant version, deployment constraints, example configuration or an offer to help test or implement it.

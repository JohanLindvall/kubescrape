name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The agent links libsystemd (journald is read natively, not via a
      # journalctl subprocess), so it is the one binary that needs cgo and the
      # headers. The metadata service stays CGO_ENABLED=0 static.
      - name: Install libsystemd headers
        run: sudo apt-get update && sudo apt-get install -y libsystemd-dev

      # Through `make`, so these carry TAGS (journald,azure) — i.e. the code
      # that actually ships. A bare `go build ./...` compiles the *_disabled.go
      # stubs instead of the real journald and Azure pipelines, so CI was
      # building and testing a variant nobody deploys and both optional
      # pipelines' wiring went unbuilt on every PR.
      - run: make build
      - run: make vet

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^hack/' || true)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - run: make test

      # The build-tag guard: no cgo without journald, no franz-go without
      # azure. The Makefile calls it "cheap enough for CI" and CI did not run
      # it, so a stray untagged import in cmd/kubescrape-agent could re-link
      # libsystemd or franz-go into every variant — including the static image
      # whose entire purpose is not having them — with nothing to catch it.
      - run: make verify-tags

      # The tag-less variant still has to compile and pass: it is what a bare
      # `go build` produces, and its stubs must stay in step with the real
      # implementations they replace.
      - name: build and test with no optional pipelines
        run: make build test TAGS=

      # docs/METRICS.md is generated from the registrations; this fails if a
      # metric was added or renamed without regenerating it.
      - name: metrics doc is current
        run: go test ./internal/obs/ -run 'TestMetricsDocIsCurrent|TestDocumentedMetricsExist'

      # Concurrency-touching code (store, metaclient cache, otlpingest) has
      # targeted race exercises; CLAUDE.md asks for this pass, so run it here
      # rather than relying on it being remembered locally.
      - name: go test -race
        run: CGO_ENABLED=1 go test -race ./internal/store/ ./pkg/metaclient/ ./internal/agent/otlpingest/ ./internal/metrics/ ./internal/logline/ ./pkg/logattrs/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsystemd-dev
      # `make lint` rather than golangci-lint-action: the Makefile already
      # pins GOLANGCI_LINT_VERSION and installs it, so this keeps ONE source
      # of truth for the linter version. Carrying it in the workflow too is
      # what broke the first run — CI asked for a version the action could not
      # run, and it would have drifted from the Makefile regardless.
      - run: make lint

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/kubescrape
      # Render the value combinations that have broken before: staticAttrs
      # alone once rendered -config plus its ConfigMap but neither the volume
      # nor the mount, CrashLoopBackOff-ing every node.
      - name: helm template (value matrix)
        run: |
          set -eu
          for args in \
            "" \
            "--set agent.staticAttrs.foo=bar" \
            "--set networkPolicy.enabled=true" \
            "--set agent.ingest.enabled=true --set networkPolicy.enabled=true" \
            "--set service.scrapeAuthSecrets=true --set service.scrapeAuthToken.existingSecret=tok" \
            "--set service.scrapeAuthSecrets=true --set service.scrapeAuthToken.value=tok"; do
            echo "== helm template $args"
            out=$(helm template t charts/kubescrape $args)
            flag=$(printf '%s' "$out" | grep -c 'config=/etc/kubescrape/config/config.yaml' || true)
            mount=$(printf '%s' "$out" | grep -c 'mountPath: /etc/kubescrape/config' || true)
            if [ "$flag" != "$mount" ]; then
              echo "-config flag ($flag) and its volumeMount ($mount) disagree"; exit 1
            fi
          done

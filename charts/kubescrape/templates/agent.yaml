{{/*
  agentConfig merges the staticAttrs convenience value into the unified config's
  resourceAttributes.static. It used to render the -resource-attrs-static flag,
  which the agent dropped: static attributes now live only in the config
  section they were always merged into. An explicit config value wins over
  staticAttrs.
*/}}
{{- $cfg := fromYaml (include "kubescrape.agentConfig" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-agent
  namespace: {{ .Release.Namespace }}
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-agent
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
rules:
  # Solely for authenticating to the kubelet. The kubelet picks the subresource
  # from the request PATH: /metrics and /metrics/cadvisor authorize against
  # nodes/metrics, /stats/* against nodes/stats, so agent.kubeletSummary needs
  # the second one. Both are granted UNCONDITIONALLY rather than behind the
  # value: enabling the scrape through agent.extraArgs — which people do —
  # would otherwise 403 on every node, every scrape interval, with the
  # ClusterRole looking correct. The grant is read-only node telemetry either
  # way; nodes/stats names the same pods nodes/metrics does, plus their volume
  # and PVC names.
  - apiGroups: [""]
    resources: ["nodes/metrics", "nodes/stats"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-agent
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-agent
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-agent
    namespace: {{ .Release.Namespace }}
{{- if $cfg }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-agent-config
  namespace: {{ .Release.Namespace }}
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml $cfg | nindent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-agent
    {{- include "kubescrape.labels" . | nindent 4 }}
spec:
  {{- with .Values.agent.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-agent
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-agent
      annotations:
        checksum/config: {{ $cfg | toYaml | sha256sum }}
        {{- if and .Values.metrics.enabled .Values.metrics.scrapeAnnotations }}
        # kubescrape discovers prometheus.io/* annotations itself, so the agent
        # scrapes its own runtime metrics like any other pod.
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ include "kubescrape.port" .Values.metrics.listen | quote }}
        prometheus.io/path: /metrics
        {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}-agent
      # The shutdown sequence is bounded but not instant: producers stop
      # under a budget, then the final log-metrics, cgroup-stats and
      # self-metrics exports run, then (with agent.bufferDir) the disk buffer
      # drains. The kubelet default of 30s cuts that short during a collector
      # outage; values.yaml's terminationGracePeriodSeconds covers all three
      # agent-binary workloads.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.agent.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Pod-level seccomp (kubescrape.podSecurityContext, which says how
             to omit it). RuntimeDefault is right here too, but it does NOT make
             this pod admissible on a namespace labelled `restricted`: the agent
             runs as UID 0 and mounts hostPath /var/log, which `restricted`
             forbids whatever this says, so its namespace needs `privileged`
             (see values.yaml's seccompProfile). */}}
      {{- if .Values.seccompProfile }}
      {{- include "kubescrape.podSecurityContext" . | nindent 6 }}
      {{- end }}
      containers:
        - name: agent
          image: {{ include "kubescrape.image" . }}
          imagePullPolicy: {{ include "kubescrape.imagePullPolicy" . }}
          command: ["/kubescrape-agent"]
          args:
            - -metadata-endpoint=http://{{ .Release.Name }}.{{ .Release.Namespace }}
            {{- if .Values.service.scrapeAuthSecrets }}
            # /v1/scrape-auth returns Secret values and is authenticated. The
            # flag, the mount and the service's own token all key off this one
            # value so the two sides cannot drift apart.
            - -scrape-auth-token-file={{ include "kubescrape.scrapeAuthTokenPath" . }}
            {{- end }}
            - -listen={{ .Values.agent.listen }}
            {{- if .Values.agent.debug.tokenSecret.name }}
            # /debug/otlp, /debug/otlp/ui and /debug/tailer stream this NODE's
            # whole telemetry feed — every log line it ships, from every
            # namespace scheduled here — and this port is reachable from every
            # pod in the cluster. With no token they answer only a LOCAL
            # connection (kubectl port-forward, or a container in this pod);
            # naming a Secret here opens them to a bearer token instead. The
            # path is the mount below, through one helper, so the two cannot
            # drift into a silent fallback to local-only.
            - -debug-token-file={{ include "kubescrape.debugTokenPath" . }}
            {{- end }}
            - -self-metrics-interval={{ .Values.agent.selfMetricsInterval }}
            {{- include "kubescrape.agentOtlpArgs" . }}
            - -logs={{ .Values.agent.logs }}
            - -metrics={{ .Values.agent.metrics }}
            - -cadvisor={{ .Values.agent.cadvisor }}
            - -cadvisor-rollups={{ .Values.agent.cadvisorRollups }}
            - -node-metrics={{ .Values.agent.nodeMetrics }}
            {{- /* The kubelet's third endpoint, /stats/summary: JSON rather
                   than exposition, and the only source of per-pod ephemeral
                   storage USAGE — the quantity the eviction manager measures a
                   pod against, which neither /metrics/cadvisor nor
                   kube-state-metrics reports. Parts of the rest of the payload
                   DO restate cadvisor rows; values.yaml lists which. OFF by
                   default because it authorizes against nodes/stats: the
                   ClusterRole above grants it, but a chart upgrade is not the
                   only way this binary reaches a node. */}}
            - -kubelet-summary={{ .Values.agent.kubeletSummary }}
            {{- with .Values.agent.kubeletEndpoint }}
            - -kubelet-endpoint={{ . }}
            {{- end }}
            - -kubelet-insecure-tls={{ .Values.agent.kubeletInsecureTLS }}
            - -positions-file={{ .Values.agent.positionsFile }}
            - -enrich={{ .Values.agent.enrich }}
            - -logs-file-attributes={{ .Values.agent.logsFileAttributes }}
            {{- if .Values.agent.logsRateLimit }}
            - -logs-rate-limit={{ .Values.agent.logsRateLimit }}
            - -logs-rate-burst={{ .Values.agent.logsRateBurst }}
            - -logs-rate-drop={{ .Values.agent.logsRateDrop }}
            {{- end }}
            - -logs-unknown-files={{ .Values.agent.logsUnknownFiles }}
            - -logs-idle-close={{ .Values.agent.logsIdleClose }}
            {{- with .Values.agent.bufferDir }}
            - -buffer-dir={{ . }}
            - -buffer-max-bytes={{ int64 $.Values.agent.bufferMaxBytes }}
            {{- end }}
            {{- if $cfg }}
            - -config=/etc/kubescrape/config/config.yaml
            {{- end }}
            {{- include "kubescrape.logsMetricsArgs" . }}
            - -logs-watch={{ .Values.agent.logsWatch }}
            - -logs-poll-interval={{ .Values.agent.logsPollInterval }}
            - -logs-fingerprint-bytes={{ int64 .Values.agent.logsFingerprintBytes }}
            - -logs-multiline={{ .Values.agent.multiline }}
            {{- /* Default: this release's namespace AND the namespace of the
                   ONE in-cluster destination this chart renders for the LOGS
                   signal — `agent.config.export.logs.endpoint` when it names
                   one, otherwise the -otlp-endpoint flag. Every line the agent
                   tails goes there, the destination's own included, so tailing
                   its namespace is a loop that amplifies precisely when the
                   destination is already slow. The release namespace is not
                   enough on its own: the endpoint defaults to
                   otel-collector.monitoring, so a release installed anywhere
                   else would tail the collector's own namespace.

                   It used to read the FLAG endpoint alone, so the collectorless
                   arrangement the export section exists for — `export.logs`
                   pointing at an in-cluster gateway while the flag keeps its
                   default — reopened exactly this loop. Silently: the files are
                   skipped at DISCOVERY, so nothing counts and nothing warns.
                   The first fix then read BOTH, which broke the same rule from
                   the other side: with `export.logs` set, `ExportConfig.signalConfig`
                   REPLACES the base for that signal, so the flag endpoint is a
                   metrics/traces-only address (or, with all three overridden,
                   one `BuildExporter` never dials at all) and excluding its
                   namespace stopped collecting logs it never caused — just as
                   silently, and invisible to the goldens because every chartcheck
                   fixture rendered into `monitoring`, the default endpoint's own
                   namespace, where the two terms collapse under `uniq`.

                   `agent.config.routing` routes are deliberately NOT read: a
                   route is selected BY namespace and the per-tenant shape names
                   the tenant's own namespace on both sides, so excluding it
                   would drop exactly the logs the route delivers. See
                   kubescrape.inClusterNamespace, which also owns the in-cluster
                   test and the label-before-svc rule with their war stories.

                   `null` (the default) picks these; an explicit [] excludes
                   nothing, which `default` could not express. */}}
            {{- $excl := .Values.agent.logsExcludeNamespaces }}
            {{- if kindIs "invalid" $excl }}
            {{-   $excl = list .Release.Namespace }}
            {{- /* Only a LOGS destination can feed itself: this flag governs
                   which namespaces are TAILED, so the loop is "the agent
                   ships a collector's own logs to that collector, which logs
                   about receiving them". A metrics or traces destination
                   receives nothing this flag can suppress, so excluding its
                   namespace would silently stop collecting logs it never
                   caused. There is exactly ONE logs destination, never two:
                   this mirrors `otlpexport.ExportConfig.signalConfig`, where a
                   non-empty `export.logs.endpoint` REPLACES the base for that
                   signal rather than adding to it. Do NOT "simplify" this back
                   into a list of both — that reopens the over-exclusion above,
                   and the collectorless shape (all three signals overridden)
                   would exclude the namespace of an address nothing dials.
                   An export.logs section with an EMPTY endpoint inherits the
                   base, which is why the fallback is the flag rather than "".
                   A `routing` route is deliberately not a candidate either:
                   routing keys ON namespace, so a per-tenant route names the
                   very namespace whose logs it exists to deliver. */}}
            {{-   $logsEP := .Values.agent.otlp.endpoint | default "" }}
            {{-   $exp := (get $cfg "export") | default dict }}
            {{-   if kindIs "map" $exp }}
            {{-     $o := (get $exp "logs") | default dict }}
            {{-     if kindIs "map" $o }}
            {{-       $ov := (get $o "endpoint") | default "" }}
            {{-       if $ov }}
            {{-         $logsEP = $ov }}
            {{-       end }}
            {{-     end }}
            {{-   end }}
            {{-   $ns := include "kubescrape.inClusterNamespace" $logsEP }}
            {{-   if $ns }}
            {{-     $excl = append $excl $ns }}
            {{-   end }}
            {{-   $excl = uniq $excl }}
            {{- end }}
            - -logs-exclude-namespaces={{ join "," $excl }}
            - -scrape-interval={{ .Values.agent.scrapeInterval }}
            - -scrape-exemplars={{ .Values.agent.scrapeExemplars }}
            - -scrape-health-metrics={{ .Values.agent.scrapeHealthMetrics }}
            {{- if .Values.agent.journald.enabled }}
            - -journald
            {{- with .Values.agent.journald.dir }}
            - -journald-dir={{ . }}
            {{- end }}
            {{- with .Values.agent.journald.units }}
            - -journald-units={{ join "," . }}
            {{- end }}
            - -journald-batch-size={{ int64 .Values.agent.journald.batchSize }}
            - -journald-max-batch-bytes={{ int64 .Values.agent.journald.maxBatchBytes }}
            - -journald-flush-interval={{ .Values.agent.journald.flushInterval }}
            {{- end }}
            {{- if .Values.agent.cgroupStats.enabled }}
            {{- /* High-frequency cgroup sampling. The cadvisor scrape reports
                   one average per scrapeInterval; this ships the distribution
                   (stddev/max/min of the CPU rate and the working set) of the
                   same window, so a two-second burst inside a thirty-second
                   window is still visible. Needs the read-only host
                   /sys/fs/cgroup mount rendered below — without it the agent
                   sees only its own cgroup and exports nothing, which it warns
                   about at startup and reports as kubescrape_cgroup_containers
                   0. */}}
            - -cgroup-stats
            - -cgroup-stats-interval={{ .Values.agent.cgroupStats.interval }}
            {{- /* The discovery cadence is the pipeline's blind spot for
                   short-lived containers, and lowering it spends the METADATA
                   SERVICE's request budget rather than this node's CPU — which
                   is why it is a value and not a constant. */}}
            - -cgroup-stats-discover-interval={{ .Values.agent.cgroupStats.discoverInterval }}
            {{- /* ALWAYS explicit, and never /sys/fs/cgroup by default: see the
                   mount below for why the host hierarchy lives elsewhere. An
                   explicit root on a cgroup v1 node is still the node's
                   property (the sampler disables itself there), so this does
                   not turn a mixed fleet's v1 nodes into a CrashLoop. */}}
            - -cgroup-stats-root={{ .Values.agent.cgroupStats.root | default "/host/sys/fs/cgroup" }}
            {{- end }}
            {{- if .Values.agent.ingest.enabled }}
            {{- /* LOGS AND METRICS. Traces are pushed to the trace tier
                   (templates/servicegraph.yaml) instead: both things worth
                   doing to a trace — pairing its two halves into a
                   service-graph edge, and sampling it as a whole — need every
                   span of that trace in one process, and a per-node receiver
                   holds an arbitrary subset by construction. */}}
            - -ingest
            - -ingest-grpc-endpoint={{ .Values.agent.ingest.grpcEndpoint }}
            - -ingest-http-endpoint={{ .Values.agent.ingest.httpEndpoint }}
            - -ingest-metrics-mode={{ .Values.agent.ingest.metricsMode }}
            - -ingest-peer-ip-fallback={{ .Values.agent.ingest.peerIpFallback }}
            {{- include "kubescrape.ingestKeyArgs" . }}
            {{- end }}
            - -log-level={{ .Values.logLevel }}
            - -metrics-listen={{ if .Values.metrics.enabled }}{{ .Values.metrics.listen }}{{ end }}
            {{- with .Values.pprofListen }}
            - -pprof-listen={{ . }}
            {{- end }}
            {{- /* toYaml, not `- {{ . }}`: a bare plain scalar turns "-x=a: b" into a
                   MAP and silently truncates "-x=y #z" at the comment marker.
                   The two singletons already rendered it this way. */}}
            {{- with .Values.agent.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The by-name self-metadata fallback needs this: under
            # hostNetwork the hostname is the NODE's, not the pod's.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          securityContext:
            # UID 0 because container log files under /var/log/pods are
            # root-readable only. Reading them needs no CAPABILITIES, though,
            # and the default set was being carried on the one workload that
            # runs on every node — the siblings all drop ALL already.
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ include "kubescrape.port" .Values.agent.listen | int }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ include "kubescrape.port" .Values.metrics.listen | int }}
            {{- end }}
            {{- if .Values.agent.ingest.enabled }}
            {{- /* Without agent.ingest.service.enabled (the Service rendered
                   below this DaemonSet, internalTrafficPolicy: Local) or this
                   hostPort, the listeners are reachable at the agent's POD IP
                   and nothing else — no hostNetwork — so an application has no
                   stable address for "the local agent". The Service is the one
                   to prefer: it keeps a push on the sender's node, keeps the
                   sender's source address, which is what
                   -ingest-peer-ip-fallback reads (kube-proxy, by default, does
                   not masquerade pod-to-Service traffic), and stays under
                   agent.ingest.allowFrom. hostPort is for a sender that cannot
                   use cluster DNS, and costs more than a port: on a CNI that
                   implements it with the portmap plugin (kind's does) the hop
                   MASQUERADES a same-node sender, so the agent sees the node's
                   address and the peer-IP fallback resolves nothing — a sender
                   behind it must carry k8s.pod.uid or container.id itself (the
                   recipe in values.yaml does). What NOT to do is a plain
                   ClusterIP Service over the DaemonSet: it round-robins a push
                   to some OTHER node's agent, which breaks node locality and
                   the node-local argument that sized -ingest-max-in-flight
                   (peer-IP still resolves — /v1/pod-ips is cluster-wide — so
                   that is not the reason). hostPort is off by default because
                   it occupies the port on EVERY node and collides with
                   anything else claiming it. */}}
            {{- with .Values.agent.ingest.grpcEndpoint }}
            - name: otlp-grpc
              containerPort: {{ include "kubescrape.port" . | int }}
              {{- if $.Values.agent.ingest.hostPort }}
              hostPort: {{ include "kubescrape.port" . | int }}
              {{- end }}
            {{- end }}
            {{- with .Values.agent.ingest.httpEndpoint }}
            - name: otlp-http
              containerPort: {{ include "kubescrape.port" . | int }}
              {{- if $.Values.agent.ingest.hostPort }}
              hostPort: {{ include "kubescrape.port" . | int }}
              {{- end }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          volumeMounts:
            {{- /* $cfg, NOT .Values.agent.config: staticAttrs merges into $cfg
                   and renders both the ConfigMap and -config, so guarding the
                   mount on the raw value handed the agent a -config path that
                   nothing mounted and CrashLoopBackOff-ed every node. */}}
            {{- if $cfg }}
            - name: config
              mountPath: /etc/kubescrape/config
              readOnly: true
            {{- end }}
            {{- if .Values.service.scrapeAuthSecrets }}
            - name: scrape-auth
              mountPath: /etc/kubescrape/scrape-auth
              readOnly: true
            {{- end }}
            {{- if .Values.agent.debug.tokenSecret.name }}
            - name: debug-token
              mountPath: /etc/kubescrape/debug
              readOnly: true
            {{- end }}
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: state
              mountPath: /var/lib/kubescrape-agent
            {{- if .Values.agent.otlp.bearerTokenSecret.name }}
            - name: otlp-token
              mountPath: /etc/kubescrape/otlp-token
              readOnly: true
            {{- end }}
            {{- if .Values.agent.journald.enabled }}
            # Volatile journals; persistent ones live under the /var/log
            # mount above.
            - name: runlogjournal
              mountPath: /run/log/journal
              readOnly: true
            {{- /* The node's machine id, and it is NOT optional for the
                   persistent journal (the Debian/Ubuntu/RHEL default).
                   go-systemd opens with SD_JOURNAL_LOCAL_ONLY, under which
                   libsystemd reads /var/log/journal/<id> only when <id> is the
                   CONTAINER's own machine id; the image has no /etc/machine-id,
                   so without this the reader starts, blocks and exports zero
                   records. /run/log/journal is exempt from the rule, which is
                   why a volatile-journal node (and kind, and therefore the
                   e2e) works without it. Promtail, Alloy and fluent-bit all
                   carry the same mount. */}}
            - name: machineid
              mountPath: /etc/machine-id
              readOnly: true
            {{- end }}
            {{- if .Values.agent.cgroupStats.enabled }}
            {{- /* The mount point follows `root`, because `root` is where the
                   agent LOOKS. Rendering -cgroup-stats-root against a mountPath
                   hardcoded to /sys/fs/cgroup made every non-default value
                   CrashLoop the DaemonSet: an explicitly configured root with
                   nothing mounted behind it is fatal by design (an operator
                   error, identical on every node), so the value was unusable
                   without hand-rolling a volume through extraVolumes. The
                   hostPath below stays /sys/fs/cgroup — that is where the
                   hierarchy is ON THE NODE, and a node where it is not is one
                   this feature cannot work on.

                   The default is /host/sys/fs/cgroup and NOT /sys/fs/cgroup:
                   the container runs in its own cgroup namespace, where
                   /sys/fs/cgroup is its OWN cgroup and /proc/self/cgroup says
                   "/". Mounting the node's root over it made the agent read the
                   NODE root's memory.max, find no limit, and run with no Go
                   soft memory limit (GOMEMLIMIT) under a 512Mi cap — the OOM
                   insurance silently off on exactly the agents that enable
                   this feature. */}}
            # The host's cgroup hierarchy. Read-only: the sampler reads three
            # files per container and writes nothing. Mounted BESIDE the
            # container's own /sys/fs/cgroup, never over it.
            - name: cgroup
              mountPath: {{ .Values.agent.cgroupStats.root | default "/host/sys/fs/cgroup" }}
              readOnly: true
            {{- end }}
            {{- with .Values.agent.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources: {{ toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: state
          hostPath:
            path: /var/lib/kubescrape-agent
            type: DirectoryOrCreate
        {{- if $cfg }}
        - name: config
          configMap:
            name: {{ .Release.Name }}-agent-config
        {{- end }}
        {{- if .Values.service.scrapeAuthSecrets }}
        - name: scrape-auth
          secret:
            secretName: {{ include "kubescrape.scrapeAuthSecretName" . }}
        {{- end }}
        {{- if .Values.agent.debug.tokenSecret.name }}
        - name: debug-token
          secret:
            secretName: {{ .Values.agent.debug.tokenSecret.name }}
        {{- end }}
        {{- if .Values.agent.otlp.bearerTokenSecret.name }}
        - name: otlp-token
          secret:
            secretName: {{ .Values.agent.otlp.bearerTokenSecret.name }}
        {{- end }}
        {{- if .Values.agent.journald.enabled }}
        - name: runlogjournal
          hostPath:
            path: /run/log/journal
            type: DirectoryOrCreate
        {{- /* `File`, not FileOrCreate: an empty /etc/machine-id is worse than
               an absent one — sd_id128_get_machine() fails on it exactly as it
               does on nothing, so the pod would start and read nothing, which
               is the failure this mount exists to close. A node with no
               /etc/machine-id cannot serve a persistent journal anyway — but
               the cost of `File` there is NOT confined to the journal: the
               kubelet's hostPath type check fails, so that node's WHOLE agent
               (logs, metrics, cadvisor) stays in ContainerCreating and the
               DaemonSet rollout stalls on it. Loud rather than silent, which
               is this chart's rule for mounts (see the cgroup one below), and
               documented at agent.journald in values.yaml: with journald
               enabled every scheduled node needs /etc/machine-id. */}}
        - name: machineid
          hostPath:
            path: /etc/machine-id
            type: File
        {{- end }}
        {{- if .Values.agent.cgroupStats.enabled }}
        {{- /* `Directory`, not DirectoryOrCreate: an absent /sys/fs/cgroup is a
               node this feature cannot work on, and creating an empty directory
               over it would hand the agent a root that looks mounted and holds
               nothing — a silent zero instead of a scheduling failure. */}}
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        {{- end }}
        {{- with .Values.agent.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- /* Guarded on an endpoint EXISTING, like the ingest NetworkPolicy rule: a
       Service whose `ports` renders empty is refused by the API server. */}}
{{- if and .Values.agent.ingest.enabled .Values.agent.ingest.service.enabled (or .Values.agent.ingest.grpcEndpoint .Values.agent.ingest.httpEndpoint) }}
---
{{- /*
  The address an application uses for "the agent on MY node":
  <release>-agent-ingest.<namespace>:4317/4318.

  internalTrafficPolicy: Local is the whole point, and what separates this from
  the plain ClusterIP Service values.yaml warns against: kube-proxy sends a
  connection only to an endpoint on the CLIENT's node, so a push never
  round-robins to another node's agent (the node-local argument that sized
  -ingest-max-in-flight holds), and kube-proxy by default leaves a
  pod-sourced connection's source address alone, so -ingest-peer-ip-fallback
  still names the sender. Unlike a hostPort it claims no port on the node, and
  the traffic arrives at the agent's pod IP, so agent.ingest.allowFrom still
  applies.

  With no READY agent on the sender's node (one starting, or mid-rollout)
  there is no local endpoint and the push fails rather than leaving the node;
  the sender's retry covers the gap.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-agent-ingest
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-agent
    {{- include "kubescrape.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  internalTrafficPolicy: Local
  selector:
    app: {{ .Release.Name }}-agent
  ports:
    {{- with .Values.agent.ingest.grpcEndpoint }}
    - name: otlp-grpc
      port: {{ include "kubescrape.port" . | int }}
      targetPort: otlp-grpc
    {{- end }}
    {{- with .Values.agent.ingest.httpEndpoint }}
    - name: otlp-http
      port: {{ include "kubescrape.port" . | int }}
      targetPort: otlp-http
    {{- end }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# Agent ingress. The selector must be the AGENT's label: this policy used to
# select `app: <release>` — the metadata SERVICE's pods — so enabling it left
# the DaemonSet with no policy at all while silently narrowing the service to a
# single port. Every port declared on the container belongs here, or the chart
# would firewall off an endpoint it opened in the same file; the metrics port in
# particular is the one metrics.scrapeAnnotations tells Prometheus to scrape.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-agent
  namespace: {{ .Release.Namespace }}
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-agent
  policyTypes: [Ingress]
  ingress:
    # THREE rules, because these ports have three different audiences and a
    # NetworkPolicy rule's `from` and `ports` apply TOGETHER — one rule with a
    # `from` would scope every port in it. Same split, for the same reason, as
    # the trace tier's policy in servicegraph.yaml.
    #
    # 1. The -listen port: /healthz, /readyz, the /debug index, /debug/targets,
    #    /debug/transforms — and the three DATA-BEARING routes, /debug/otlp,
    #    /debug/otlp/ui and /debug/tailer, which stream this node's whole
    #    telemetry feed.
    #
    #    OPEN TO EVERY POD BY DEFAULT, and that is deliberate rather than
    #    unconsidered: the kubelet probes this port and a DaemonSet rolling
    #    update stops dead on a failing readiness probe, while WHAT IS WORTH
    #    PROTECTING here is protected in-process instead — the three
    #    data-bearing routes answer only a local connection (a port-forward
    #    arrives as loopback) or the agent.debug.tokenSecret bearer token, and
    #    refuse everything else with kubescrape_debug_refused_total{reason}.
    #    A neighbour pod reaching this port gets probes and target/transform
    #    state, which is what the metadata service's /v1 routes already serve
    #    it unauthenticated.
    #
    #    agent.debug.allowFrom narrows it anyway, for a fleet that wants defence
    #    in depth. Read its comment in values.yaml first: a policy scopes a PORT
    #    and not a path, so the probes are narrowed with it and the `from` must
    #    include whatever your CNI presents the kubelet as.
    - ports:
        - port: {{ include "kubescrape.port" .Values.agent.listen | int }}
      {{- with .Values.agent.debug.allowFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.metrics.enabled }}
    # 2. The Prometheus scrape port. Deliberately unscoped: metrics.scrapeAnnotations
    #    asks for it to be scraped from wherever Prometheus runs, and this
    #    chart cannot know where that is. It serves the process's own
    #    go_*/process_*/kubescrape_* counters — no telemetry contents.
    #    Undeclared ports (pprof, which exposes goroutine stacks and heap
    #    contents) stay closed on every rule here.
    - ports:
        - port: {{ include "kubescrape.port" .Values.metrics.listen | int }}
    {{- end }}
    {{- /* Guarded on an endpoint EXISTING, not just on `enabled`: a rule whose
           `ports` list renders empty is `ports: null`, which means EVERY port —
           so an ingest section enabled with both endpoints blanked would have
           handed allowFrom's peers the probe and metrics ports as well, in the
           one rule written to narrow something. */}}
    {{- if and .Values.agent.ingest.enabled (or .Values.agent.ingest.grpcEndpoint .Values.agent.ingest.httpEndpoint) }}
    # 3. The OTLP ingest ports — the ones agent.ingest.allowFrom is FOR, and the
    #    FIRST thing to tighten on this workload.
    #
    #    WHAT THEY EXPOSE, stated plainly: any pod that can reach them can push
    #    arbitrary OTLP logs and metrics through this node's agent, with no
    #    credential. Enrichment resolves the container.id / k8s.pod.uid the
    #    SENDER supplies (agent.ingest.containerIdKeys / podUidKeys) and stamps
    #    whatever pod that id names; nothing on an unauthenticated port can
    #    check that the id is the sender's own. So a pod presenting ANOTHER
    #    pod's id — which the metadata service's /v1/pods route hands to any
    #    caller — is attributed as that pod, and with `routing` configured is
    #    delivered to that pod's tenant endpoint and X-Scope-OrgID
    #    (docs/CONFIGURATION.md, "Accepted security residuals" #1). The
    #    source-address fallback (agent.ingest.peerIpFallback) is off by
    #    default and only ever applies to a resource carrying no id. A sender
    #    can also name any service.name it likes, and the cost of the volume it
    #    pushes is this node's and the collector's. EMPTY MEANS ANY POD MAY
    #    PUSH — and where `routing` separates tenants, this `from` is the lever
    #    that bounds who can cross between them.
    - ports:
        {{- with .Values.agent.ingest.grpcEndpoint }}
        - port: {{ include "kubescrape.port" . | int }}
        {{- end }}
        {{- with .Values.agent.ingest.httpEndpoint }}
        - port: {{ include "kubescrape.port" . | int }}
        {{- end }}
      {{- with .Values.agent.ingest.allowFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}

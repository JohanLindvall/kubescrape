{{/*
  agentConfig merges the staticAttrs convenience value into the unified config's
  resourceAttributes.static. It used to render the -resource-attrs-static flag,
  which the agent dropped: static attributes now live only in the config
  section they were always merged into. An explicit config value wins over
  staticAttrs.
*/}}
{{- $cfg := fromYaml (include "kubescrape.agentConfig" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-agent
  namespace: {{ .Release.Namespace }}
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-agent
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
rules:
  # Solely for authenticating to the kubelet. The kubelet picks the subresource
  # from the request PATH: /metrics and /metrics/cadvisor authorize against
  # nodes/metrics, /stats/* against nodes/stats, so agent.kubeletSummary needs
  # the second one. Both are granted UNCONDITIONALLY rather than behind the
  # value: enabling the scrape through agent.extraArgs — which people do —
  # would otherwise 403 on every node, every scrape interval, with the
  # ClusterRole looking correct. The grant is read-only node telemetry either
  # way; nodes/stats names the same pods nodes/metrics does, plus their volume
  # and PVC names.
  - apiGroups: [""]
    resources: ["nodes/metrics", "nodes/stats"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-agent
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-agent
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-agent
    namespace: {{ .Release.Namespace }}
{{- if $cfg }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-agent-config
  namespace: {{ .Release.Namespace }}
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml $cfg | nindent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-agent
    {{- include "kubescrape.labels" . | nindent 4 }}
spec:
  {{- with .Values.agent.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-agent
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-agent
      annotations:
        checksum/config: {{ $cfg | toYaml | sha256sum }}
        {{- if and .Values.metrics.enabled .Values.metrics.scrapeAnnotations }}
        # kubescrape discovers prometheus.io/* annotations itself, so the agent
        # scrapes its own runtime metrics like any other pod.
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ (split ":" .Values.metrics.listen)._1 | quote }}
        prometheus.io/path: /metrics
        {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}-agent
      # The shutdown sequence is bounded but not instant: producers stop
      # under a budget, then the final log-metrics, span-metrics and
      # self-metrics exports run, then the disk buffer drains. The kubelet
      # default of 30s cuts that short during a collector outage.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.agent.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: {{ include "kubescrape.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/kubescrape-agent"]
          args:
            - -metadata-endpoint=http://{{ .Release.Name }}.{{ .Release.Namespace }}
            {{- if .Values.service.scrapeAuthSecrets }}
            # /v1/scrape-auth returns Secret values and is authenticated. The
            # flag, the mount and the service's own token all key off this one
            # value so the two sides cannot drift apart.
            - -scrape-auth-token-file=/etc/kubescrape/scrape-auth/{{ .Values.service.scrapeAuthToken.key | default "token" }}
            {{- end }}
            - -listen={{ .Values.agent.listen }}
            - -self-metrics-interval={{ .Values.agent.selfMetricsInterval }}
            - -otlp-endpoint={{ .Values.agent.otlp.endpoint }}
            - -otlp-protocol={{ .Values.agent.otlp.protocol }}
            - -otlp-compression={{ .Values.agent.otlp.compression }}
            - -otlp-compression-level={{ int64 .Values.agent.otlp.compressionLevel }}
            - -otlp-insecure={{ .Values.agent.otlp.insecure }}
            - -otlp-tls-insecure-skip-verify={{ .Values.agent.otlp.tlsInsecureSkipVerify }}
            {{- with .Values.agent.otlp.caFile }}
            - -otlp-tls-ca-file={{ . }}
            {{- end }}
            - -otlp-timeout={{ .Values.agent.otlp.timeout }}
            - -otlp-retry-attempts={{ .Values.agent.otlp.retryAttempts }}
            - -otlp-retry-backoff={{ .Values.agent.otlp.retryBackoff }}
            {{- with .Values.agent.otlp.maxSendBytes }}
            - -otlp-max-send-bytes={{ int64 . }}
            {{- end }}
            {{- if .Values.agent.otlp.bearerTokenSecret.name }}
            - -otlp-bearer-token-file=/etc/kubescrape/otlp-token/{{ .Values.agent.otlp.bearerTokenSecret.key }}
            {{- end }}
            - -logs={{ .Values.agent.logs }}
            - -metrics={{ .Values.agent.metrics }}
            - -cadvisor={{ .Values.agent.cadvisor }}
            - -cadvisor-rollups={{ .Values.agent.cadvisorRollups }}
            - -node-metrics={{ .Values.agent.nodeMetrics }}
            {{- /* The kubelet's third endpoint, /stats/summary: JSON rather
                   than exposition, and the only source of per-pod ephemeral
                   storage USAGE — the quantity the eviction manager measures a
                   pod against, which neither /metrics/cadvisor nor
                   kube-state-metrics reports. Parts of the rest of the payload
                   DO restate cadvisor rows; values.yaml lists which. OFF by
                   default because it authorizes against nodes/stats: the
                   ClusterRole above grants it, but a chart upgrade is not the
                   only way this binary reaches a node. */}}
            - -kubelet-summary={{ .Values.agent.kubeletSummary }}
            {{- with .Values.agent.kubeletEndpoint }}
            - -kubelet-endpoint={{ . }}
            {{- end }}
            - -kubelet-insecure-tls={{ .Values.agent.kubeletInsecureTLS }}
            - -positions-file={{ .Values.agent.positionsFile }}
            - -enrich={{ .Values.agent.enrich }}
            - -logs-file-attributes={{ .Values.agent.logsFileAttributes }}
            {{- if .Values.agent.logsRateLimit }}
            - -logs-rate-limit={{ .Values.agent.logsRateLimit }}
            - -logs-rate-burst={{ .Values.agent.logsRateBurst }}
            - -logs-rate-drop={{ .Values.agent.logsRateDrop }}
            {{- end }}
            - -logs-unknown-files={{ .Values.agent.logsUnknownFiles }}
            - -logs-idle-close={{ .Values.agent.logsIdleClose }}
            {{- with .Values.agent.bufferDir }}
            - -buffer-dir={{ . }}
            - -buffer-max-bytes={{ int64 $.Values.agent.bufferMaxBytes }}
            {{- end }}
            {{- if $cfg }}
            - -config=/etc/kubescrape/config/config.yaml
            {{- end }}
            {{- with .Values.agent.logsMetrics.interval }}
            - -logs-metrics-interval={{ . }}
            {{- end }}
            {{- with .Values.agent.logsMetrics.maxBytes }}
            - -logs-metrics-max-bytes={{ include "kubescrape.logsMetricsMaxBytes" . }}
            {{- end }}
            {{- with .Values.agent.logsMetrics.namePrefix }}
            - -logs-metrics-name-prefix={{ . }}
            {{- end }}
            - -logs-watch={{ .Values.agent.logsWatch }}
            - -logs-poll-interval={{ .Values.agent.logsPollInterval }}
            - -logs-fingerprint-bytes={{ int64 .Values.agent.logsFingerprintBytes }}
            - -logs-multiline={{ .Values.agent.multiline }}
            {{- /* Default: this release's namespace AND the namespace of every
                   in-cluster UNCONDITIONAL destination this chart renders — the
                   -otlp-endpoint flag and each per-signal `agent.config.export`
                   override. Every line the agent tails goes to those, the
                   destination's own included, so tailing their namespaces is a
                   loop that amplifies precisely when the destination is already
                   slow. The release namespace is not enough on its own: the
                   endpoint defaults to otel-collector.monitoring, so a release
                   installed anywhere else would tail the collector's own
                   namespace.

                   It used to read the FLAG endpoint alone, so the collectorless
                   arrangement the export section exists for — `export.logs`
                   pointing at an in-cluster gateway while the flag keeps its
                   default — reopened exactly this loop. Silently: the files are
                   skipped at DISCOVERY, so nothing counts and nothing warns.

                   `agent.config.routing` routes are deliberately NOT read: a
                   route is selected BY namespace and the per-tenant shape names
                   the tenant's own namespace on both sides, so excluding it
                   would drop exactly the logs the route delivers. See
                   kubescrape.inClusterNamespace, which also owns the in-cluster
                   test and the label-before-svc rule with their war stories.

                   `null` (the default) picks these; an explicit [] excludes
                   nothing, which `default` could not express. */}}
            {{- $excl := .Values.agent.logsExcludeNamespaces }}
            {{- if kindIs "invalid" $excl }}
            {{-   $excl = list .Release.Namespace }}
            {{- /* Only a LOGS destination can feed itself: this flag governs
                   which namespaces are TAILED, so the loop is "the agent
                   ships a collector's own logs to that collector, which logs
                   about receiving them". A metrics or traces destination
                   receives nothing this flag can suppress, so excluding its
                   namespace would silently stop collecting logs it never
                   caused — the flag's base endpoint and the export section's
                   LOGS endpoint are therefore the only two candidates. A
                   `routing` route is deliberately not one either: routing
                   keys ON namespace, so a per-tenant route names the very
                   namespace whose logs it exists to deliver. */}}
            {{-   $eps := list (.Values.agent.otlp.endpoint | default "") }}
            {{-   $exp := (get $cfg "export") | default dict }}
            {{-   if kindIs "map" $exp }}
            {{-     $o := (get $exp "logs") | default dict }}
            {{-     if kindIs "map" $o }}
            {{-       $eps = append $eps ((get $o "endpoint") | default "") }}
            {{-     end }}
            {{-   end }}
            {{-   range $ep := $eps }}
            {{-     $ns := include "kubescrape.inClusterNamespace" $ep }}
            {{-     if $ns }}
            {{-       $excl = append $excl $ns }}
            {{-     end }}
            {{-   end }}
            {{-   $excl = uniq $excl }}
            {{- end }}
            - -logs-exclude-namespaces={{ join "," $excl }}
            - -scrape-interval={{ .Values.agent.scrapeInterval }}
            - -scrape-exemplars={{ .Values.agent.scrapeExemplars }}
            - -scrape-health-metrics={{ .Values.agent.scrapeHealthMetrics }}
            {{- if .Values.agent.journald.enabled }}
            - -journald
            {{- with .Values.agent.journald.dir }}
            - -journald-dir={{ . }}
            {{- end }}
            {{- with .Values.agent.journald.units }}
            - -journald-units={{ join "," . }}
            {{- end }}
            - -journald-batch-size={{ int64 .Values.agent.journald.batchSize }}
            - -journald-max-batch-bytes={{ int64 .Values.agent.journald.maxBatchBytes }}
            - -journald-flush-interval={{ .Values.agent.journald.flushInterval }}
            {{- end }}
            {{- if .Values.agent.cgroupStats.enabled }}
            {{- /* High-frequency cgroup sampling. The cadvisor scrape reports
                   one average per scrapeInterval; this ships the distribution
                   (stddev/max/min of the CPU rate and the working set) of the
                   same window, so a two-second burst inside a thirty-second
                   window is still visible. Needs the read-only /sys/fs/cgroup
                   mount rendered below — without it the agent sees only its own
                   cgroup and exports nothing, which it warns about at startup
                   and reports as kubescrape_cgroup_containers 0. */}}
            - -cgroup-stats
            - -cgroup-stats-interval={{ .Values.agent.cgroupStats.interval }}
            {{- /* The discovery cadence is the pipeline's blind spot for
                   short-lived containers, and lowering it spends the METADATA
                   SERVICE's request budget rather than this node's CPU — which
                   is why it is a value and not a constant. */}}
            - -cgroup-stats-discover-interval={{ .Values.agent.cgroupStats.discoverInterval }}
            {{- with .Values.agent.cgroupStats.root }}
            - -cgroup-stats-root={{ . }}
            {{- end }}
            {{- end }}
            {{- if .Values.agent.ingest.enabled }}
            {{- /* LOGS AND METRICS. Traces are pushed to the trace tier
                   (templates/servicegraph.yaml) instead: both things worth
                   doing to a trace — pairing its two halves into a
                   service-graph edge, and sampling it as a whole — need every
                   span of that trace in one process, and a per-node receiver
                   holds an arbitrary subset by construction. */}}
            - -ingest
            - -ingest-grpc-endpoint={{ .Values.agent.ingest.grpcEndpoint }}
            - -ingest-http-endpoint={{ .Values.agent.ingest.httpEndpoint }}
            - -ingest-metrics-mode={{ .Values.agent.ingest.metricsMode }}
            - -ingest-peer-ip-fallback={{ .Values.agent.ingest.peerIpFallback }}
            {{- with .Values.agent.ingest.containerIdKeys }}
            - -ingest-container-id-keys={{ join "," . }}
            {{- end }}
            {{- with .Values.agent.ingest.podUidKeys }}
            - -ingest-pod-uid-keys={{ join "," . }}
            {{- end }}
            {{- with .Values.agent.ingest.grpcMaxRecvBytes }}
            - -ingest-grpc-max-recv-bytes={{ int64 . }}
            {{- end }}
            {{- end }}
            - -log-level={{ .Values.logLevel }}
            - -metrics-listen={{ if .Values.metrics.enabled }}{{ .Values.metrics.listen }}{{ end }}
            {{- with .Values.pprofListen }}
            - -pprof-listen={{ . }}
            {{- end }}
            - -log-format={{ .Values.logFormat }}
            {{- range .Values.agent.extraArgs }}
            - {{ . }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The by-name self-metadata fallback needs this: under
            # hostNetwork the hostname is the NODE's, not the pod's.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          securityContext:
            # UID 0 because container log files under /var/log/pods are
            # root-readable only. Reading them needs no CAPABILITIES, though,
            # and the default set was being carried on the one workload that
            # runs on every node — the siblings all drop ALL already.
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ (split ":" .Values.agent.listen)._1 | int }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ (split ":" .Values.metrics.listen)._1 | int }}
            {{- end }}
            {{- if .Values.agent.ingest.enabled }}
            {{- with .Values.agent.ingest.grpcEndpoint }}
            - name: otlp-grpc
              containerPort: {{ (split ":" .)._1 | int }}
            {{- end }}
            {{- with .Values.agent.ingest.httpEndpoint }}
            - name: otlp-http
              containerPort: {{ (split ":" .)._1 | int }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          volumeMounts:
            {{- /* $cfg, NOT .Values.agent.config: staticAttrs merges into $cfg
                   and renders both the ConfigMap and -config, so guarding the
                   mount on the raw value handed the agent a -config path that
                   nothing mounted and CrashLoopBackOff-ed every node. */}}
            {{- if $cfg }}
            - name: config
              mountPath: /etc/kubescrape/config
              readOnly: true
            {{- end }}
            {{- if .Values.service.scrapeAuthSecrets }}
            - name: scrape-auth
              mountPath: /etc/kubescrape/scrape-auth
              readOnly: true
            {{- end }}
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: state
              mountPath: /var/lib/kubescrape-agent
            {{- if .Values.agent.otlp.bearerTokenSecret.name }}
            - name: otlp-token
              mountPath: /etc/kubescrape/otlp-token
              readOnly: true
            {{- end }}
            {{- if .Values.agent.journald.enabled }}
            # Volatile journals; persistent ones live under the /var/log
            # mount above.
            - name: runlogjournal
              mountPath: /run/log/journal
              readOnly: true
            {{- end }}
            {{- if .Values.agent.cgroupStats.enabled }}
            {{- /* The mount point follows `root`, because `root` is where the
                   agent LOOKS. Rendering -cgroup-stats-root against a mountPath
                   hardcoded to /sys/fs/cgroup made every non-default value
                   CrashLoop the DaemonSet: an explicitly configured root that
                   is not a cgroup v2 hierarchy is fatal by design (an operator
                   error, identical on every node), so the value was unusable
                   without hand-rolling a volume through extraVolumes. The
                   hostPath below stays /sys/fs/cgroup — that is where the
                   hierarchy is ON THE NODE, and a node where it is not is one
                   this feature cannot work on. */}}
            # The host's cgroup hierarchy. Read-only: the sampler reads three
            # files per container and writes nothing.
            - name: cgroup
              mountPath: {{ .Values.agent.cgroupStats.root | default "/sys/fs/cgroup" }}
              readOnly: true
            {{- end }}
            {{- with .Values.agent.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources: {{ toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: state
          hostPath:
            path: /var/lib/kubescrape-agent
            type: DirectoryOrCreate
        {{- if $cfg }}
        - name: config
          configMap:
            name: {{ .Release.Name }}-agent-config
        {{- end }}
        {{- if .Values.service.scrapeAuthSecrets }}
        - name: scrape-auth
          secret:
            secretName: {{ .Values.service.scrapeAuthToken.existingSecret | default (printf "%s-scrape-auth" .Release.Name) }}
        {{- end }}
        {{- if .Values.agent.otlp.bearerTokenSecret.name }}
        - name: otlp-token
          secret:
            secretName: {{ .Values.agent.otlp.bearerTokenSecret.name }}
        {{- end }}
        {{- if .Values.agent.journald.enabled }}
        - name: runlogjournal
          hostPath:
            path: /run/log/journal
            type: DirectoryOrCreate
        {{- end }}
        {{- if .Values.agent.cgroupStats.enabled }}
        {{- /* `Directory`, not DirectoryOrCreate: an absent /sys/fs/cgroup is a
               node this feature cannot work on, and creating an empty directory
               over it would hand the agent a root that looks mounted and holds
               nothing — a silent zero instead of a scheduling failure. */}}
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        {{- end }}
        {{- with .Values.agent.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# Agent ingress. The selector must be the AGENT's label: this policy used to
# select `app: <release>` — the metadata SERVICE's pods — so enabling it left
# the DaemonSet with no policy at all while silently narrowing the service to a
# single port. Every port declared on the container belongs here, or the chart
# would firewall off an endpoint it opened in the same file; the metrics port in
# particular is the one metrics.scrapeAnnotations tells Prometheus to scrape.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-agent
  namespace: {{ .Release.Namespace }}
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-agent
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: {{ (split ":" .Values.agent.listen)._1 | int }}
        {{- if .Values.metrics.enabled }}
        - port: {{ (split ":" .Values.metrics.listen)._1 | int }}
        {{- end }}
        {{- if .Values.agent.ingest.enabled }}
        {{- with .Values.agent.ingest.grpcEndpoint }}
        - port: {{ (split ":" .)._1 | int }}
        {{- end }}
        {{- with .Values.agent.ingest.httpEndpoint }}
        - port: {{ (split ":" .)._1 | int }}
        {{- end }}
        {{- end }}
{{- end }}

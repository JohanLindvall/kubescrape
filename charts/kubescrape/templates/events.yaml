{{- if or .Values.events.enabled .Values.azure.enabled }}
{{- /*
  Kubernetes events are a CLUSTER-SINGLETON pipeline, so they run as their own
  single-replica Deployment of the agent binary with every per-node pipeline
  off — deliberately NOT in the DaemonSet:

    * every agent would need cluster-wide `events` read plus lease/configmap
      write, putting those credentials on every node in the cluster, where the
      DaemonSet today holds nothing but the two kubelet subresources
      (`nodes/metrics` and `nodes/stats`, get, which authorize a call to the
      kubelet) and makes no API-server request at all;
    * each non-leader polls the election Lease once per RetryPeriod, so the
      election alone would cost ~N/2 API reads per second — the fan-out this
      project exists to avoid.

  Deployed this way the reader gets the agent's processing chain (logs.rules,
  scrubbing, log-metrics, transforms, routing) and enriches through the
  metadata service exactly as agents do. NOT the disk buffer: this template
  renders no -buffer-dir, and the pod has a read-only root filesystem with no
  writable volume to spool into.

  Azure diagnostics (azure.enabled) ride in the SAME Deployment — also a
  cluster-scoped stream — but need none of the events RBAC and no leader
  election: the Event Hubs consumer group is the coordination, and its
  committed offsets are the position.
*/}}
{{- $cfg := fromYaml (include "kubescrape.agentConfig" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-events
  namespace: {{ .Release.Namespace }}
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
  {{- if and .Values.azure.enabled .Values.azure.clientId }}
  annotations:
    # The AKS workload-identity webhook keys the federated credential off
    # this annotation (plus the pod label below).
    azure.workload.identity/client-id: {{ .Values.azure.clientId }}
  {{- end }}
{{- if .Values.events.enabled }}
{{- /* The events READ grant is as wide as the reader: cluster-wide by default,
       and a namespaced Role + RoleBinding in THAT namespace when
       events.namespace narrows the reader to one (-events-namespace). Every
       events call the reader makes is CoreV1().Events(<that namespace>), so a
       ClusterRole there granted every other namespace's events to a pod that
       never asks for them. The Role lives in the WATCHED namespace (a Role
       grants only within its own) and binds the ServiceAccount from the
       release namespace. */}}
{{- if .Values.events.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-events-read
  namespace: {{ .Values.events.namespace }}
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
rules:
  # Exactly the reader's calls, in the one namespace it reads: see the
  # cluster-wide variant below for why it is list+watch on core/v1 only.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-events-read
  namespace: {{ .Values.events.namespace }}
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-events-read
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-events
    namespace: {{ .Release.Namespace }}
{{- else }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-events
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
rules:
  # The only cluster-wide grant: reading events, rendered only when the reader
  # watches the whole cluster (events.namespace empty). It lands on THIS
  # ServiceAccount, never on the DaemonSet's — and it is exactly what the
  # reader uses and nothing beside it. The reader is core/v1 only
  # (`CoreV1().Events(...)`), and it only ever List+Watches: the initial LIST
  # (which the relist path re-runs, paginated) plus one WATCH. There is no
  # single-object Get anywhere in internal/agent/events, and no EventsV1()
  # call, so `get` and the `events.k8s.io` mirror were grants nothing
  # exercises. They read the same underlying objects, so removing them changes
  # no behaviour — but an operator hand-managing RBAC should be told the truth
  # about which representation the code reads, and a least-privilege review
  # should be able to see it from here.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-events
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-events
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-events
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-events
  namespace: {{ .Release.Namespace }}
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
rules:
  # Both objects below are split into a CREATE rule and a resourceNames-scoped
  # get/update rule. RBAC ignores resourceNames on create — the object has no
  # name until the request is admitted — so create must stay unscoped, which
  # costs nothing: create alone cannot touch an object that already exists.
  # get/update are the verbs that CAN reach a foreign object, and the code only
  # ever names ONE Lease and ONE ConfigMap, both rendered from the same values
  # into the flags below, so scoping them is free. Unscoped, this Role let
  # anything running in the events pod rewrite the {{ .Release.Name }}-agent-config
  # ConfigMap this chart puts in the same namespace — pointing every agent's
  # `export:` at another collector on its next restart. Keep the two halves in
  # step with -events-lease / -events-position-configmap: a name changed in one
  # place and not the other is a startup that cannot read its own position.
  # Leader election: exactly one replica may watch, or every event ships twice.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [{{ .Values.events.leaseName | quote }}]
    verbs: ["get", "update"]
  # The resume position. It cannot be a node-local file like the tailer's
  # positions store: the leader moves, and the successor after a kill is a
  # different pod that must be able to read where the previous one got to.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ .Values.events.positionConfigMap | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-events
  namespace: {{ .Release.Namespace }}
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-events
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-events
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-events
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-events
    {{- include "kubescrape.labels" . | nindent 4 }}
spec:
  # One replica is the norm; leader election makes >1 safe (and makes a
  # rolling update's overlap safe even at 1).
  replicas: {{ .Values.events.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}-events
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-events
        {{- if and .Values.azure.enabled .Values.azure.clientId }}
        azure.workload.identity/use: "true"
        {{- end }}
      annotations:
        {{- if $cfg }}
        checksum/config: {{ $cfg | toYaml | sha256sum }}
        {{- end }}
        {{- if and .Values.metrics.enabled .Values.metrics.scrapeAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ include "kubescrape.port" .Values.metrics.listen | quote }}
        prometheus.io/path: /metrics
        {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}-events
      # The shutdown sequence is bounded but not instant: the readers stop
      # under a budget (the events reader's final flush and position write;
      # the Azure reader just stops, its uncommitted records redelivered on
      # the next start), then the final log-metrics and self-metrics exports
      # run. There is no disk buffer to drain here (see the header). The
      # kubelet default of 30s cuts that short during a collector outage.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.events.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.events.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.events.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Pod-level seccomp: see kubescrape.podSecurityContext. */}}
      {{- if .Values.seccompProfile }}
      {{- include "kubescrape.podSecurityContext" . | nindent 6 }}
      {{- end }}
      containers:
        - name: events
          image: {{ include "kubescrape.image" . }}
          imagePullPolicy: {{ include "kubescrape.imagePullPolicy" . }}
          command: ["/kubescrape-agent"]
          args:
            # Every per-node pipeline off: this replica only runs the
            # cluster-scoped ones.
            - -logs=false
            - -metrics=false
            - -cadvisor=false
            - -node-metrics=false
            - -journald=false
            - -ingest=false
            - -metadata-endpoint=http://{{ .Release.Name }}.{{ .Release.Namespace }}
            - -listen={{ .Values.agent.listen }}
            {{- if .Values.agent.debug.tokenSecret.name }}
            # This replica runs no tailer, so /debug/tailer is not registered —
            # but /debug/otlp and its UI are, on every workload running the
            # agent binary, and here they stream the CLUSTER's Kubernetes
            # Events and (with azure.enabled) its Azure diagnostic records.
            # Without a token those two answer only a local connection.
            - -debug-token-file={{ include "kubescrape.debugTokenPath" . }}
            {{- end }}
            - -self-metrics-interval={{ .Values.agent.selfMetricsInterval }}
            {{- if .Values.events.enabled }}
            - -events
            - -events-lease={{ .Values.events.leaseName }}
            - -events-position-configmap={{ .Values.events.positionConfigMap }}
            - -events-start={{ .Values.events.start }}
            - -events-batch-size={{ int64 .Values.events.batchSize }}
            - -events-flush-interval={{ .Values.events.flushInterval }}
            - -events-position-interval={{ .Values.events.positionInterval }}
            {{- with .Values.events.namespace }}
            - -events-namespace={{ . }}
            {{- end }}
            {{- end }}
            {{- if .Values.azure.enabled }}
            - -azure-diagnostics
            {{- with include "kubescrape.azureNamespaces" . }}
            - -azure-eventhub-namespace={{ . }}
            {{- end }}
            {{- with .Values.azure.eventhub.topics }}
            - -azure-eventhub-topics={{ join "," . }}
            {{- end }}
            - -azure-eventhub-group={{ .Values.azure.eventhub.group }}
            {{- if .Values.azure.eventhub.connectionStringSecret.name }}
            - -azure-eventhub-connection-string-file={{ include "kubescrape.azureConnStringFiles" . }}
            {{- end }}
            {{- with .Values.azure.clientId }}
            - -azure-client-id={{ . }}
            {{- end }}
            {{- with .Values.azure.tenantId }}
            - -azure-tenant-id={{ . }}
            {{- end }}
            - -azure-start={{ .Values.azure.start }}
            - -azure-metric-prefix={{ .Values.azure.metricPrefix }}
            {{- end }}
            {{- /* The whole agent.otlp block, shared with the DaemonSet and the
                   trace tier (see the argument-block helpers). */}}
            {{- include "kubescrape.agentOtlpArgs" . }}
            - -enrich={{ .Values.agent.enrich }}
            {{- if $cfg }}
            - -config=/etc/kubescrape/config/config.yaml
            {{- end }}
            {{- /* This Deployment runs the SAME logMetrics set as the
                   DaemonSet, so it renders the same knobs. */}}
            {{- include "kubescrape.logsMetricsArgs" . }}
            - -metrics-listen={{ if .Values.metrics.enabled }}{{ .Values.metrics.listen }}{{ end }}
            - -log-level={{ .Values.logLevel }}
            {{- /* pprofListen is a TOP-LEVEL value and every workload renders
                   it (pinned by internal/chartcheck
                   TestAgentBinaryWorkloadsRenderTheSameSharedFlags). */}}
            {{- with .Values.pprofListen }}
            - -pprof-listen={{ . }}
            {{- end }}
            {{- with .Values.events.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            # The agent requires a node name (its own self-metrics identity);
            # events themselves never carry it — a described object's node is
            # the object's property, not this reader's.
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            # The Lease and the position ConfigMap live in this pod's own
            # namespace; without it the reader cannot tell where to put them.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            # Identity for the self-metadata by-name fallback (the hostname
            # is not the pod's name when the pod shares the host's namespaces).
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          {{- include "kubescrape.nonRootSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ include "kubescrape.port" .Values.agent.listen | int }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ include "kubescrape.port" .Values.metrics.listen | int }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          {{- $azureSecret := and .Values.azure.enabled .Values.azure.eventhub.connectionStringSecret.name }}
          {{- $anyVolume := or $cfg .Values.agent.otlp.bearerTokenSecret.name $azureSecret .Values.agent.debug.tokenSecret.name .Values.events.extraVolumes }}
          {{- if $anyVolume }}
          volumeMounts:
            {{- if $cfg }}
            - name: config
              mountPath: /etc/kubescrape/config
              readOnly: true
            {{- end }}
            {{- if .Values.agent.otlp.bearerTokenSecret.name }}
            - name: otlp-token
              mountPath: /etc/kubescrape/otlp-token
              readOnly: true
            {{- end }}
            {{- if $azureSecret }}
            - name: azure-eventhub
              mountPath: /etc/kubescrape/azure-eventhub
              readOnly: true
            {{- end }}
            {{- if .Values.agent.debug.tokenSecret.name }}
            - name: debug-token
              mountPath: /etc/kubescrape/debug
              readOnly: true
            {{- end }}
            {{- with .Values.events.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          resources: {{ toYaml .Values.events.resources | nindent 12 }}
      {{- if $anyVolume }}
      volumes:
        {{- if $cfg }}
        - name: config
          configMap:
            name: {{ .Release.Name }}-agent-config
        {{- end }}
        {{- if .Values.agent.otlp.bearerTokenSecret.name }}
        - name: otlp-token
          secret:
            secretName: {{ .Values.agent.otlp.bearerTokenSecret.name }}
        {{- end }}
        {{- if $azureSecret }}
        - name: azure-eventhub
          secret:
            secretName: {{ .Values.azure.eventhub.connectionStringSecret.name }}
        {{- end }}
        {{- if .Values.agent.debug.tokenSecret.name }}
        - name: debug-token
          secret:
            secretName: {{ .Values.agent.debug.tokenSecret.name }}
        {{- end }}
        {{- with .Values.events.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-events
  namespace: {{ .Release.Namespace }}
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-events
  policyTypes: [Ingress]
  ingress:
    # TWO rules, because these two ports have two audiences and a rule's `from`
    # and `ports` apply TOGETHER. This singleton opens no receiver of any kind
    # — it only reads (the Kubernetes Events watch, an Event Hubs consumer) and
    # exports — so there is no third.
    #
    # 1. The -listen port: /healthz and /readyz, which the kubelet probes, the
    #    /debug index, and — this is what the comment here used to deny by
    #    saying "nothing else is served" — /debug/otlp and /debug/otlp/ui,
    #    which stream what THIS replica exports: every Kubernetes Event in the
    #    cluster, and with azure.enabled every Azure diagnostic record it
    #    consumes. /debug/tailer is genuinely absent (no tailer runs here).
    #
    #    Open to every pod by default, and safe because those two routes are
    #    gated in-process: local connection (a port-forward arrives as
    #    loopback) or the agent.debug.tokenSecret bearer token. agent.debug.allowFrom
    #    narrows the port itself — read its comment first, since the probes
    #    share it.
    - ports:
        - port: {{ include "kubescrape.port" .Values.agent.listen | int }}
      {{- with .Values.agent.debug.allowFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.metrics.enabled }}
    # 2. The Prometheus scrape port: this replica's own go_*/process_*/kubescrape_*
    #    counters, unscoped because metrics.scrapeAnnotations asks for it to be
    #    scraped from wherever Prometheus runs. Undeclared ports (pprof) stay
    #    closed.
    - ports:
        - port: {{ include "kubescrape.port" .Values.metrics.listen | int }}
    {{- end }}
{{- end }}
{{- end }}

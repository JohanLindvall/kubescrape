{{- /*
  The bearer token guarding GET /v1/scrape-auth. That route serves Secret
  material (the service holds cluster-wide `secrets: get`), so the binary
  refuses to start with -scrape-auth-secrets and no token. Precedence:
  an existing Secret the user manages > an explicit value > a generated
  random token, which is read back from the live Secret on upgrade so
  rolling the chart does not invalidate every agent's token.
*/}}
{{- $scrapeAuthKey := .Values.service.scrapeAuthToken.key | default "token" }}
{{- $scrapeAuthSecret := .Values.service.scrapeAuthToken.existingSecret }}
{{- $scrapeAuthToken := .Values.service.scrapeAuthToken.value }}
{{- if and .Values.service.scrapeAuthSecrets (not $scrapeAuthSecret) }}
{{- $scrapeAuthSecret = printf "%s-scrape-auth" .Release.Name }}
{{- if not $scrapeAuthToken }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $scrapeAuthSecret) }}
{{- if and $existing (index $existing.data $scrapeAuthKey) }}
{{- $scrapeAuthToken = index $existing.data $scrapeAuthKey | b64dec }}
{{- else }}
{{- $scrapeAuthToken = randAlphaNum 48 }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
{{- if and .Values.service.scrapeAuthSecrets (not .Values.service.scrapeAuthToken.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $scrapeAuthSecret }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $scrapeAuthKey }}: {{ $scrapeAuthToken | quote }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "services", "nodes"]
    verbs: ["get", "list", "watch"]
  # StatefulSets and DaemonSets own their pods directly (no ReplicaSet in
  # between), so their metadata informers are what gives those workloads'
  # pods owner labels and annotations at all.
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  # Optional: ServiceMonitor discovery (-servicemonitors).
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "podmonitors"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.service.scrapeAuthSecrets }}
  # Serving monitor endpoints' bearerTokenSecret to agents. The flag, this
  # rule and both sides' token all key off service.scrapeAuthSecrets, so they
  # cannot drift apart.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  {{- end }}
  {{- with .Values.service.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
    {{- include "kubescrape.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.service.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      {{- if and .Values.metrics.enabled .Values.metrics.scrapeAnnotations }}
      annotations:
        # kubescrape's own agents discover prometheus.io/* annotations, so the
        # service's runtime metrics are scraped like any other pod's.
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ (split ":" .Values.metrics.listen)._1 | quote }}
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      {{- with .Values.service.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.service.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Pod-level seccomp. Kubernetes' own default is Unconfined, which is
             LOOSER than what a plain `docker run` gets, and PodSecurity's
             `restricted` profile rejects a pod without RuntimeDefault outright
             — so on a namespace labelled restricted these pods used to fail
             ADMISSION, which on a first install looks like the chart being
             broken. Set `seccompProfile: null` to omit the field entirely —
             NOT `{}`, which cannot work: helm COALESCES a user map onto the
             chart's default map, so an empty one arrives here as the default
             `{type: RuntimeDefault}` and renders. Only an explicit null
             removes the key. */}}
      {{- with .Values.seccompProfile }}
      securityContext:
        seccompProfile:
          {{- toYaml . | nindent 10 }}
      {{- end }}
      containers:
        - name: kubescrape
          image: {{ include "kubescrape.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          args:
            - -listen={{ .Values.service.listen }}
            - -self-metrics-interval={{ .Values.service.selfMetricsInterval }}
            - -wait-timeout={{ .Values.service.waitTimeout }}
            - -cache-ttl={{ .Values.service.cacheTTL }}
            - -servicemonitors={{ .Values.service.serviceMonitors }}
            {{- if .Values.service.scrapeAuthSecrets }}
            {{- /* The token file is mandatory here: the binary refuses to
                   serve Secret material on an unauthenticated endpoint. */}}
            - -scrape-auth-secrets=true
            - -scrape-auth-token-file=/etc/kubescrape/scrape-auth/{{ $scrapeAuthKey }}
            {{- end }}
            {{- /* The OTLP output carries the service's own self-metrics push. */}}
            - -otlp-endpoint={{ .Values.service.otlp.endpoint }}
            - -otlp-protocol={{ .Values.service.otlp.protocol }}
            - -otlp-compression={{ .Values.service.otlp.compression }}
            - -otlp-compression-level={{ int64 .Values.service.otlp.compressionLevel }}
            - -otlp-insecure={{ .Values.service.otlp.insecure }}
            - -otlp-tls-insecure-skip-verify={{ .Values.service.otlp.tlsInsecureSkipVerify }}
            {{- with .Values.service.otlp.caFile }}
            - -otlp-tls-ca-file={{ . }}
            {{- end }}
            - -otlp-timeout={{ .Values.service.otlp.timeout }}
            {{- if .Values.service.otlp.bearerTokenSecret.name }}
            - -otlp-bearer-token-file=/etc/kubescrape/otlp-token/{{ .Values.service.otlp.bearerTokenSecret.key }}
            {{- end }}
            - -log-level={{ .Values.logLevel }}
            - -metrics-listen={{ if .Values.metrics.enabled }}{{ .Values.metrics.listen }}{{ end }}
            {{- with .Values.pprofListen }}
            - -pprof-listen={{ . }}
            {{- end }}
            {{- range .Values.service.extraArgs }}
            - {{ . }}
            {{- end }}
          {{- if or .Values.service.otlp.bearerTokenSecret.name .Values.service.scrapeAuthSecrets }}
          volumeMounts:
            {{- if .Values.service.otlp.bearerTokenSecret.name }}
            - name: otlp-token
              mountPath: /etc/kubescrape/otlp-token
              readOnly: true
            {{- end }}
            {{- if .Values.service.scrapeAuthSecrets }}
            - name: scrape-auth-token
              mountPath: /etc/kubescrape/scrape-auth
              readOnly: true
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ (split ":" .Values.service.listen)._1 | int }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ (split ":" .Values.metrics.listen)._1 | int }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources: {{ toYaml .Values.service.resources | nindent 12 }}
      {{- /* The OTLP output (and its token) serves the self-metrics push. */}}
      {{- if or .Values.service.otlp.bearerTokenSecret.name .Values.service.scrapeAuthSecrets }}
      volumes:
        {{- if .Values.service.otlp.bearerTokenSecret.name }}
        - name: otlp-token
          secret:
            secretName: {{ .Values.service.otlp.bearerTokenSecret.name }}
        {{- end }}
        {{- if .Values.service.scrapeAuthSecrets }}
        {{- /* The SAME Secret is mounted into the agent DaemonSet, which
               presents the token as `Authorization: Bearer <token>`. */}}
        - name: scrape-auth-token
          secret:
            secretName: {{ $scrapeAuthSecret }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.service.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.service.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# Metadata-service ingress. The agent fleet polls the API port and, when
# metrics.scrapeAnnotations is on, a scraper reaches the metrics port — so both
# belong here. The pprof port is deliberately NOT opened: it exposes goroutine
# stacks and heap contents, and is the one listener the chart wants firewalled.
#
# BOTH RULES ARE OPEN TO EVERY POD, and unlike the agent's this is not backed by
# a second gate: the /v1 routes are unauthenticated BY DESIGN, because every
# agent polls them on every cycle and a per-agent credential buys nothing the
# ServiceAccount does not already imply. What they hand out is pod, owner and
# namespace metadata — object metadata the node's own kubelet already holds, and
# with kubectl.kubernetes.io/last-applied-configuration and kapp's
# original-object annotation stripped (kubemeta.FilterAnnotations), because
# those carry the whole applied spec verbatim. /v1/scrape-auth is the one
# exception and the one route that serves Secret material: it is bearer-
# authenticated (service.scrapeAuthToken) and refuses to be enabled without a
# token. This port also serves the /debug index and its forms, which are
# ungated for the same reason — they show the same documents the /v1 routes do.
#
# TO TIGHTEN IT, add a `from` to the first rule below scoping it to the agent
# DaemonSet (and to anything else you point at the API):
#   from:
#     - podSelector: {matchLabels: {app: <release>-agent}}
# There is no value for it because the failure mode of getting it wrong is
# fleet-wide: every agent stops resolving container metadata at once, and the
# symptom is unattributed telemetry rather than an error anyone is watching.
# The metrics rule stays separate so scoping the API does not also cut the
# Prometheus scrape, which metrics.scrapeAnnotations asked for.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "kubescrape.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    # 1. The metadata API, plus /healthz, /readyz and /debug.
    - ports:
        - port: {{ (split ":" .Values.service.listen)._1 | int }}
    {{- if .Values.metrics.enabled }}
    # 2. The Prometheus scrape port.
    - ports:
        - port: {{ (split ":" .Values.metrics.listen)._1 | int }}
    {{- end }}
{{- end }}

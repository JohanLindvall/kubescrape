image:
  repository: ghcr.io/johanlindvall/kubescrape
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# (Go runtime and process metrics are always served on the -metrics-listen port
# below — see `metrics.enabled`. The former `runtimeMetrics` value configured a
# flag that no longer exists and made every agent refuse to start.)

# Grace period for ALL THREE workloads — the agent DaemonSet, the events/Azure
# singleton AND the service-graph StatefulSet. It has to cover the bounded
# shutdown sequence: producers stop, the final log-metrics, span-metrics and
# self-metrics exports run, then the disk buffer drains. Lowering it to speed up
# node drains truncates the trace tier too, where the shutdown flush is the only
# thing that saves the in-memory pairing store and the tail-sampling buffer's
# undecided spans — those have no sender still holding them and are simply lost
# to a SIGKILL.
terminationGracePeriodSeconds: 60

# Prometheus /metrics endpoint on a DEDICATED port, serving this process's Go
# runtime and process metrics (go_*, process_*). Separate from the health/debug
# listener so the scrape target can be exposed independently. kubescrape's own
# kubescrape_* metrics are NOT here while the OTLP push runs (the default):
# they ride the push. With selfMetricsInterval: 0 the push is off and this
# port serves them too — one knob selects the delivery, never both.
metrics:
  enabled: true
  listen: ":9090"
  # Stamp prometheus.io/* annotations on the pods, which kubescrape's own
  # discovery (and a stock Prometheus) picks up — so the agents scrape their
  # own runtime metrics with no extra configuration.
  scrapeAnnotations: true

# net/http/pprof on its OWN port (empty disables, the default). Profiles expose
# goroutine stacks and heap contents, so this is the port to firewall or bind
# to localhost — hence a separate listener from metrics and health.
pprofListen: ""

logLevel: info       # both components
logFormat: text

# The metadata service (Deployment).
service:
  replicas: 1
  # An evicted metadata service stalls attribution cluster-wide (agents block
  # on lookups), so it schedules at cluster-critical priority. Set "" to omit.
  priorityClassName: system-cluster-critical
  # Spread replicas across nodes/zones when replicas > 1 (replicas are
  # coordination-free by design, so scaling out is safe). Standard
  # topologySpreadConstraints entries, rendered verbatim.
  topologySpreadConstraints: []
  listen: ":8080"
  # Export the service's own metrics over OTLP at this interval (0 disables);
  # uses the otlp settings below. A Go duration string (1m, 500ms, 1h30m), or a
  # bare 0 — the value the line above documents, which YAML reads as a number.
  # The schema refuses everything the binary's duration flag would reject, in
  # both forms it can arrive in: 60, 0.5, 1e1, abc and negatives, quoted or not.
  selfMetricsInterval: 1m
  waitTimeout: 5s
  cacheTTL: 5m
  # Serve targets for monitoring.coreos.com ServiceMonitors that select
  # pod-backed Services (needs the CRD installed; RBAC is always granted).
  # PodMonitors are discovered under the same flag whenever the
  # cluster serves that CRD. Honored per endpoint: port/targetPort/path/
  # scheme, interval/scrapeTimeout, basicAuth, authorization,
  # bearerTokenSecret, tlsConfig (insecureSkipVerify, secret-backed
  # ca/cert/keySecret, serverName) and keep/drop metricRelabelings; anything
  # else is reported, never silently dropped. Serving the secret-backed
  # material to agents additionally needs -scrape-auth-secrets
  # (see scrapeAuthSecrets below).
  # NOTE: honouring monitors cluster-wide means any namespace owner can direct
  # every agent's scrapes. Restrict which namespaces' monitors count with
  # `extraArgs: [-monitor-namespaces=monitoring,platform]` — and note the
  # allowlist behind scrapeAuthSecrets is derived from the monitors this gate
  # lets through.
  serviceMonitors: false
  # OTLP endpoint for the service's own self-metrics push.
  otlp:
    endpoint: "otel-collector.monitoring:4317"
    protocol: grpc          # grpc | http
    compression: gzip       # gzip | none
    compressionLevel: 0   # gzip level: 1 fastest .. 9 smallest, 0 = library default
    insecure: true
    tlsInsecureSkipVerify: false
    caFile: ""
    timeout: 15s
    bearerTokenSecret:
      name: ""
      key: token

  # Serve monitor endpoints' bearerTokenSecret (and the other secret-backed
  # auth/TLS material) to agents on GET /v1/scrape-auth. Setting this to true
  # passes -scrape-auth-secrets, grants the ClusterRole `secrets: get`, and
  # wires the bearer token below into both the Deployment and the agent
  # DaemonSet — the flag, the RBAC and the token cannot drift apart.
  scrapeAuthSecrets: false
  # The shared bearer token guarding /v1/scrape-auth. That route is the ONLY
  # authenticated one, because it is the only one serving Secret material:
  # without a token any pod that can reach the service could read every Secret
  # key a monitor references, so the binary refuses to start with
  # -scrape-auth-secrets and no -scrape-auth-token-file.
  #
  # Leave everything empty and the chart generates a random 48-character token
  # into a Secret named <release>-scrape-auth, re-reading the live Secret on
  # upgrade so the token survives `helm upgrade`.
  #
  # Rotation needs NO restart, of the service or of the agents: updating the
  # Secret is sufficient. The service re-reads the file about once a minute and
  # keeps accepting the PREVIOUS token for a 5-minute grace window, and the
  # agents re-read their copy on the same cadence — so neither side has to flip
  # in lockstep with the other.
  scrapeAuthToken:
    existingSecret: ""   # use a Secret you manage instead of the generated one
    key: token           # key within the Secret (mounted at /etc/kubescrape/scrape-auth/<key>)
    value: ""            # literal token to put in the generated Secret
  # Extra ClusterRole rules appended verbatim.
  extraRules: []
  # Less-common service flags go here (scrapeAuthSecrets above already passes
  # -scrape-auth-secrets and -scrape-auth-token-file; do not repeat them).
  extraArgs: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1

# The per-node agent (DaemonSet).
agent:
  # An observability DaemonSet without node-critical priority is evicted
  # precisely when the node is in trouble — the moment its logs matter most.
  # Set "" to omit.
  priorityClassName: system-node-critical
  # DaemonSet rollout pacing; /readyz is a real readiness check, so the
  # rollout stops at the first broken node instead of marching on.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  # Scheduling knobs, rendered verbatim. The default toleration keeps agents
  # on control-plane nodes (their logs matter); tainted pools (GPU, spot)
  # need their taints added here or they silently get NO agent.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  nodeSelector: {}
  affinity: {}
  # HTTP listen address for /healthz, /readyz and the /debug routes. The
  # Prometheus /metrics endpoint is NOT here — it has its own port, see the
  # top-level `metrics:` section.
  listen: ":8081"
  # Export the agent's own metrics over OTLP at this interval (0 disables). A Go
  # duration string, or a bare 0; anything the duration flag would reject is
  # refused by the schema (see service.selfMetricsInterval above).
  selfMetricsInterval: 1m
  # Pipeline toggles.
  logs: true
  metrics: true
  cadvisor: true
  cadvisorRollups: true
  nodeMetrics: true

  # Read the systemd journal natively (libsystemd, via cgo). The default image
  # ships libsystemd.
  #
  # Enabling this adds the /run/log/journal hostPath mount to the DaemonSet,
  # because a node whose journal is VOLATILE (systemd Storage=volatile, or auto
  # with no /var/log/journal) keeps it there and nowhere under the /var/log
  # mount that carries the persistent one. dir "" reads BOTH, which is what you
  # want; setting dir restricts the reader to that ONE directory, and a
  # directory holding no journal files makes the reader start cleanly, wait
  # forever and export nothing (it warns at startup — but /readyz stays 200 and
  # no counter moves, an untouched counter never being exported).
  #
  # This pipeline is behind the `journald` BUILD TAG, which the default image
  # sets. A custom image built without it (`make image-static`, whose whole
  # point is that dropping this pipeline is what lets the agent be static)
  # does not contain the reader, and enabling it here makes the agent REFUSE
  # to start with a message naming the tag — it never silently collects
  # nothing. See docs/CONFIGURATION.md "Build variants".
  journald:
    enabled: false
    dir: ""
    units: []
    batchSize: 1024
    maxBatchBytes: 1048576  # flush before a batch's summed message bytes exceed this
    flushInterval: 2s
    # NOTE: journald cursor persistence requires agent.positionsFile to be set
    # (there is no standalone journald cursor file); without it, every restart
    # begins at the journal tail.

  # Receive OTLP LOGS AND METRICS pushed by apps on the node and enrich them
  # with k8s attributes from a container.id / k8s.pod.uid on the data before
  # forwarding.
  #
  # TRACES are not received here — they go to the trace tier (serviceGraph
  # below), because pairing a service-graph edge and sampling a trace both need
  # every span of that trace in one process, which a per-node receiver never
  # has. A sender pointed at the agent for traces gets an immediate
  # Unimplemented / 404 rather than a silent half-feature.
  ingest:
    enabled: false
    grpcEndpoint: ":4317"       # empty disables gRPC
    httpEndpoint: ":4318"       # empty disables HTTP (/v1/logs, /v1/metrics)
    metricsMode: auto           # resource | datapoint | auto
    # Attribute telemetry with no container id / pod uid to the pod owning the
    # connection's source address (opt-in; hostNetwork senders never resolve).
    peerIpFallback: false
    containerIdKeys: []         # default: [container.id, k8s.container.id]
    podUidKeys: []              # default: [k8s.pod.uid]
    # Cap on one decoded OTLP/gRPC message, in bytes (0 = gRPC's own 4 MiB
    # default; the OTLP/HTTP body cap stays 16 MiB). An over-cap push is
    # refused, not truncated. Raising it is a per-push memory grant on an
    # unauthenticated listener — the receive-buffer budget scales with it.
    # Also applied to the trace tier's application ports.
    grpcMaxRecvBytes: 0

  # Kubelet scraping; empty disables cadvisor and node metrics.
  kubeletEndpoint: "https://$(NODE_IP):10250"
  kubeletInsecureTLS: true

  otlp:
    endpoint: "otel-collector.monitoring:4317"
    protocol: grpc          # grpc | http
    compression: gzip       # gzip | none
    compressionLevel: 0   # gzip level: 1 fastest .. 9 smallest, 0 = library default
    insecure: true
    tlsInsecureSkipVerify: false
    caFile: ""
    retryAttempts: 3
    retryBackoff: 1s
    timeout: 15s
    # Cap on one exported payload's encoded protobuf size; a larger payload is
    # split into parts before sending. 0 = default (~3.75 MiB, under the 4 MiB
    # gRPC receive limit). Lower it if your collector's max_recv_msg_size is
    # smaller. Rendered with int64 to avoid scientific notation.
    maxSendBytes: 0
    # Bearer token from a Secret, mounted and passed via
    # -otlp-bearer-token-file.
    bearerTokenSecret:
      name: ""
      key: token

  # null means "this release's namespace plus the one agent.otlp.endpoint
  # names" (see the template): tailing the namespace the agent or the collector
  # runs in is a feedback loop that amplifies exactly when the collector is
  # already struggling, and the two namespaces differ whenever the endpoint
  # default (otel-collector.monitoring) is kept in a release installed
  # elsewhere. Set [] to exclude nothing.
  logsExcludeNamespaces: null
  # A single file persisting BOTH log offsets and the journald cursor across
  # restarts (empty disables persistence).
  positionsFile: /var/lib/kubescrape-agent/positions.json
  # Parse per-line metadata (timestamp, severity, trace/span IDs, exception
  # details) into the OTLP record fields (JohanLindvall/enrich). One switch for
  # container logs, journald and pushed OTLP log bodies alike.
  enrich: true
  # Per-file line rate limit (lines/second, 0 disables). Exhausted files
  # pause (no loss, backlog stays on disk) unless logsRateDrop discards.
  logsRateLimit: 0
  logsRateBurst: 0            # 0 = 2x logsRateLimit
  logsRateDrop: false
  # Where a file with no checkpoint entry starts at agent startup: end (skip
  # as pre-existing history), start (read whole), or auto (start when the
  # checkpoint store already has entries — the file appeared while the agent
  # was down and its content is unshipped; end on a first-ever run). Note that
  # auto/start make adding a new log source ingest those files' existing
  # content.
  logsUnknownFiles: auto
  # Close the fd of a fully-caught-up file after this much inactivity. The open
  # fd is the only handle to a rotated-away or deleted file's remaining bytes,
  # so this trades the zero-loss guarantee for bounded fd usage: 0 (never) is
  # the default. Set it only if a node tracks thousands of log files. A Go
  # duration string ("30s"), or a bare 0 — like every duration in this chart,
  # the schema refuses whatever the agent's flag parse would (a bare non-zero
  # number, a unitless or misspelled string, a negative), in both the quoted
  # and unquoted forms it can arrive in.
  logsIdleClose: 0
  # Stamp log.file.name and log.file.position (byte offset) on every record,
  # for each file source.
  logsFileAttributes: false
  # Disk-backed export buffer (logs + metrics): on a collector outage records
  # spool to this directory instead of pinning the tailer to old offsets or
  # dropping metrics. Empty disables. Point it at the node-local state mount so
  # it survives pod restarts; bufferMaxBytes caps the undelivered backlog per
  # signal (the tailer back-pressures when full).
  bufferDir: ""              # e.g. /var/lib/kubescrape-agent/buffer
  bufferMaxBytes: 1073741824 # 1GiB
  # All YAML config for the agent lives in one file, rendered verbatim into a
  # mounted ConfigMap and passed via -config. Each section is optional and
  # mirrors the shape of the standalone file it replaces:
  #   resourceAttributes: defaults / static / attributes / pipelines
  #   logs:               sources (include/exclude globs, containerd vs plain,
  #                       per-source attributes / compressed)
  #   logAttributes:      rules lifting JSON/logfmt keys onto attributes
  #   logMetrics:         metrics derived from log lines (see logsMetrics below)
  #   logScrubbing:       redact secrets/PII from log bodies before enrichment
  #                       (builtin: [defaults] plus custom regex rules)
  #   metrics:            scraped-series pipelines filter rules and splitters
  #   traceMetrics:       span-derived RED metrics (see serviceGraph.spanMetrics)
  #   traceSampling:      sample received spans on the trace tier (probability /
  #                       keepErrors / keepSlowerThan / maxSpansPerSecond)
  #   tailSampling:       decide WHOLE traces on the trace tier after a decision
  #                       window (policies / decisionWait / memory bounds)
  #   serviceGraph:       edge pairing on the trace tier (see serviceGraph below)
  #   serviceGraphShards: the tier's shard set for a topology this chart does
  #                       not render (see serviceGraph.replicas below, which
  #                       wires the chart's own)
  #   routing:            per-namespace fan-out to extra OTLP destinations or
  #                       tenants (endpoint / headers, e.g. X-Scope-OrgID)
  #   export:             per-signal OTLP destinations, static headers and an
  #                       mTLS client cert over the agent.otlp base — the only
  #                       way to send logs/metrics/traces to DIFFERENT endpoints
  #                       (collectorless Mimir/Loki/Tempo), which agent.otlp,
  #                       being one endpoint, cannot express
  # This list is a hand-kept copy; the authoritative one is sectionNames() in
  # cmd/kubescrape-agent/config.go (`-check-config` prints it). See
  # docs/CONFIGURATION.md. Example:
  #   config:
  #     logs:
  #       sources:
  #         - {name: containers, include: ["/var/log/containers/*.log"], containerd: true}
  #     logAttributes:
  #       rules:
  #         - {key: tenant, attribute: tenant.id, target: resource}
  #     logMetrics:
  #       metrics:
  #         - {name: http_requests_total, type: counter, value: "1", match: ["level=error"], labels: ["status=$http_status"]}
  #     resourceAttributes:
  #       static: {cluster: prod-eu}
  config: {}
  # Runtime settings for log-derived metrics (config.logMetrics); empty uses the
  # binary defaults (interval 30s, max-bytes 3 MiB, no name prefix). maxBytes is
  # integer BYTES as a string (e.g. "3145728"); human-format sizes ("3MiB") are
  # refused at template time — helm's int64 would silently parse them to 0,
  # which the flag defines as "no byte bound, one payload per export".
  logsMetrics:
    interval: ""
    maxBytes: ""
    namePrefix: ""
  logsWatch: true
  logsPollInterval: 500ms
  logsFingerprintBytes: 1024
  multiline: true
  scrapeInterval: 30s
  scrapeExemplars: false
  # Synthetic up / scrape_duration_seconds / scrape_samples_scraped gauges
  # per target.
  scrapeHealthMetrics: true

  # Static resource attributes (key: value), e.g. cluster: prod-eu. Merged into
  # config.resourceAttributes.static (an explicit value there wins). Attribute
  # keep/drop lists live in that same section as `enable:`/`disable:`.
  staticAttrs: {}

  # Less-common agent flags go here, e.g.:
  #   - "-scrape-native-histograms"  # offer the protobuf exposition to targets
  #                                  # and convert native histograms to OTLP
  #                                  # exponential histograms
  #   - "-transforms-file=/etc/kubescrape/transforms/transforms.yaml"
  #     # Starlark transforms, hot-reloaded. The file needs its OWN ConfigMap
  #     # mounted as a directory (never subPath — subPath mounts don't see
  #     # ConfigMap updates, so edits would silently never apply):
  #     #   extraVolumes:
  #     #     - {name: transforms, configMap: {name: my-transforms}}
  #     #   extraVolumeMounts:
  #     #     - {name: transforms, mountPath: /etc/kubescrape/transforms, readOnly: true}
  extraArgs: []
  # Extra volumes/mounts on the agent pod, verbatim — e.g. the
  # -transforms-file ConfigMap (see extraArgs above).
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# Kubernetes events as OTLP logs. A CLUSTER-SINGLETON: this renders its own
# single-replica Deployment of the agent binary with every per-node pipeline
# off, plus its OWN ServiceAccount — the cluster-wide `events` read and the
# lease/configmap writes never touch the DaemonSet's ServiceAccount, and the
# election does not poll once per node.
events:
  enabled: false
  replicas: 1
  # Watch one namespace instead of the whole cluster (empty = cluster-wide).
  namespace: ""
  # Where a cold start begins: end (skip the backlog), start (replay
  # everything still within the API server's event TTL), auto (resume the
  # stored position, else end).
  start: auto
  # Coordination objects, in the release namespace.
  leaseName: kubescrape-cluster-leader
  positionConfigMap: kubescrape-events-position
  batchSize: 512
  flushInterval: 2s
  # How often the position is written. A write per event would be an
  # API-server write per event, so this bounds how much is REPLAYED after a
  # hard kill (bounded duplicates, never loss).
  positionInterval: 10s
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  extraArgs: []
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

# THE TRACE TIER. This is where applications send their OTLP traces:
#
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://<release>-traces.<namespace>.svc:4318
#   OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=http/protobuf
#
# (or :4317 with the default grpc protocol). The tier enriches each push with
# Kubernetes metadata, re-shards every span by TRACE ID so one process holds the
# whole trace, and from there pairs Grafana-Tempo-compatible service-graph EDGE
# metrics, derives RED metrics, samples and exports to the collector.
#
# Why a tier and not the DaemonSet: an EDGE needs both halves of a request, and
# a request's CLIENT and SERVER spans are produced by two pods that usually run
# on two different NODES — a per-node aggregator holds half of every edge and can
# never pair anything. (Contrast the RED metrics, where each span is aggregated
# independently and per-node counters would just sum; they live here anyway,
# because this is where the spans are.)
#
# It costs a workload, one internal network hop per span and a new metric family
# — which is why it is off by default. With it off, nothing in this chart
# receives traces.
serviceGraph:
  enabled: false
  # Shard count. This number is part of the RING: every shard is given the same
  # count and derives the shard names from it, so change it here (helm upgrade),
  # never with `kubectl scale` — a count larger than the running tier addresses
  # pods that do not exist, and pushes whose traces hash there FAIL (the sender
  # retries; the entry shard holds the only copy, so it must not pretend). One
  # shard is enough for correctness and takes no internal hop at all; more
  # spreads CPU and the pairing store's memory, at one hop per span.
  replicas: 2
  # The INTERNAL receiver port: where a shard sends spans belonging to a trace
  # another shard owns. Both sides read this one value — the listener and the
  # ring's endpoint — so they cannot drift. Deliberately NOT one of the
  # application ports below: an internal hop addressed there would be re-enriched
  # (against a peer that is now a kubescrape pod) and re-sharded on every pass.
  port: 4319
  # Shared bearer token for the INTERNAL hop. That receiver is reachable from
  # every pod in the cluster and what it accepts is treated as FINAL — never
  # re-enriched, never re-routed — so it MUST be authenticated: create a Secret
  # with a random token and name it here; the file is re-read periodically so
  # rotating it needs no restart. Leaving `name` empty renders no token flag and
  # the binary REFUSES TO START that listener.
  #   kubectl -n monitoring create secret generic kubescrape-service-graph \
  #     --from-literal=token="$(openssl rand -hex 24)"
  tokenSecret:
    name: ""
    key: token
  # The APPLICATION-facing OTLP trace listeners, fronted by a ClusterIP Service
  # named <release>-traces.
  ingest:
    enabled: true
    grpcEndpoint: ":4317"       # empty disables gRPC
    httpEndpoint: ":4318"       # empty disables HTTP (/v1/traces)
    # Attribute a push whose resource carries no container.id / k8s.pod.uid to
    # the pod owning the connection's SOURCE address. Opt-in, and worth
    # understanding before enabling it here: it is only correct while that
    # address still names the sender. A ClusterIP normally preserves it, but a
    # service mesh that terminates the connection, an ingress, or any NAT hop
    # replaces it. A source address belonging to THIS tier's own pods is refused
    # and counted (kubescrape_ingest_resources_total{outcome="peer_ip_rejected"})
    # rather than attributed — an application's traces must never be labelled
    # with a kubescrape pod. The dependable alternative is for senders to set a
    # resource-level container.id (every SDK's container detector does).
    peerIpFallback: false
    # NetworkPolicy `from` selectors for the trace ports, and for those ONLY.
    # EMPTY MEANS ANY POD IN THE CLUSTER MAY PUSH TRACES, with no credential —
    # the same bargain every unauthenticated in-cluster OTLP collector makes.
    # The policy is three rules, so setting this leaves the other two alone:
    # health and metrics stay reachable (the kubelet's probes come from the
    # node, Prometheus from wherever it runs) and the internal shard port stays
    # open to this tier's own pods, which the ring is not optional without.
    #   allowFrom:
    #     - namespaceSelector: {matchLabels: {shipping-traces: "true"}}
    allowFrom: []
  # Derive RED metrics from the spans this tier receives (calls counter, size
  # counter, duration histogram with trace-id exemplars), dimensioned by
  # service.name/span.name/span.kind/status.code, exported over OTLP. Aggregated
  # on the OWNING shard, so each span counts exactly once however many shards
  # the push passed through. Tune via the agent.config traceMetrics section
  # (namePrefix / buckets / dimensions / maxCardinality / exemplars / staleAfter).
  spanMetrics: false
  spanMetricsInterval: 1m
  # TAIL SAMPLING — decide each trace as a WHOLE, after buffering its spans for a
  # decision window, instead of (or under) the per-span traceSampling above. Also
  # agent.config, also mounted here; off unless it has policies.
  #
  # READ THIS BEFORE ENABLING IT: a pushed span is ACKED to its sender before its
  # trace is decided — it has to be, or the push would hold one of the receiver's
  # in-flight slots for the whole window and stall every sender in the cluster —
  # so spans that are buffered but NOT YET DECIDED are lost if the pod is
  # hard-killed (SIGKILL, OOM, node failure). A graceful stop decides and exports
  # them, so a rolling update loses nothing; kubescrape_tail_sampling_buffered_spans
  # is what a hard kill would lose at that instant. A trace that HAS been decided
  # can be made durable: with -buffer-dir set on THIS tier (see extraVolumes
  # below — agent.bufferDir is the DaemonSet's and is not rendered here) the keep
  # is spooled to disk like logs and metrics, the one trace payload this agent
  # owns rather than forwards, so a collector outage becomes a backlog rather
  # than loss.
  #
  # Sizing rule: maxSpans x 1 KiB must fit a QUARTER of this pod's memory limit
  # (1 GiB limit -> ~262k spans; the DEFAULT limit below is 512Mi, so ~131k —
  # raise serviceGraph.resources.limits.memory alongside maxSpans, or the
  # startup check lowers/refuses it). It is CHECKED at startup — an unset maxSpans is
  # lowered to fit, an explicit one that could only OOM is refused — because the
  # likeliest hard kill here is the OOM this buffer itself causes. A shard holds
  # (its span rate x decisionWait) spans: 50k spans/s over 5s is 250k, ~250 MiB.
  # Above the pod's budget, add replicas (which divides the rate) rather than
  # raising the ceiling.
  #
  # If traceSampling above is also set, keep only its probability and
  # maxSpansPerSecond: keepErrors/keepSlowerThan are decided PER SPAN and hand
  # this layer trace fragments (the agent warns at startup naming them).
  #   config:
  #     tailSampling:
  #       decisionWait: 5s      # hold a trace this long from its FIRST span
  #       maxSpans: 120000      # TOTAL buffered spans; fits the default 512Mi
  #                             # limit (a quarter of it, at 1 KiB/span). At the
  #                             # bound the OLDEST
  #                             # trace is decided EARLY, never dropped unjudged
  #       policies:             # ORDERED, first match wins (the matching policy
  #                             # is a metric label, so "why was this kept" has
  #                             # exactly one answer)
  #         - {name: errors, type: statusCode, statusCode: {statusCodes: [ERROR]}}
  #         - {name: slow, type: latency, latency: {threshold: 500ms}}
  #         - {name: baseline, type: probabilistic, probabilistic: {samplingPercentage: 5}}
  # Tuning lives in the agent.config `serviceGraph` section (rendered into the
  # same ConfigMap this tier mounts).
  #   config:
  #     serviceGraph:
  #       wait: 10s            # how long a half-edge waits for its partner:
  #                            # longer pairs more slow requests but holds more
  #                            # memory; a rising expired counter means it is
  #                            # shorter than the real client->server gap.
  #                            # A Go duration STRING, like traceMetrics.staleAfter
  #       maxItems: 10000      # half-edges held at once; over it spans are
  #                            # dropped (counted, never silent)
  #       maxCardinality: 20000  # distinct EDGE series
  #       staleAfter: 15m      # evict unobserved edges — without it
  #                            # maxCardinality is a one-way latch. "0" disables
  #       dimensions: [http.route]   # extra client_/server_ labels
  # Anything else goes here as raw flags, in the DaemonSet's style.
  extraArgs: []
  # The tier's root filesystem is read-only and this template creates no
  # writable volume, so -buffer-dir (which is what makes a TAIL-SAMPLING
  # decision durable across a collector outage — see tailSampling above) needs
  # one mounted here. A PVC or an emptyDir both work; an emptyDir survives a
  # container restart and the outage itself, not a reschedule:
  #   extraVolumes:
  #     - name: buffer
  #       emptyDir: {sizeLimit: 2Gi}
  #   extraVolumeMounts:
  #     - name: buffer
  #       mountPath: /var/lib/kubescrape/buffer
  #   extraArgs:
  #     - -buffer-dir=/var/lib/kubescrape/buffer
  #     - -buffer-max-bytes=1073741824
  # Note that agent.bufferDir is the DaemonSet's knob and is NOT rendered here.
  extraVolumes: []
  extraVolumeMounts: []
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  # Memory scales with maxItems (half-edges awaiting a partner) and
  # maxCardinality (edge series), not with the cluster's span rate; CPU scales
  # with the forwarded span rate divided by the shard count.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# Azure diagnostic-settings ingestion (resource logs + platform metrics) from
# an Event Hubs namespace over its Kafka endpoint. Cluster-scoped like
# events, so it runs in the SAME singleton Deployment (either section's
# `enabled` renders it; replica count and scheduling come from `events.*`) —
# but it needs no leader election: the Kafka consumer group is the
# coordination, and its committed offsets are the resume position.
# Behind the `azure` BUILD TAG, which the default image sets; an image built
# without it refuses to start when this is enabled (docs/CONFIGURATION.md,
# "Build variants").
azure:
  enabled: false
  eventhub:
    # Namespace host (myns.servicebus.windows.net). May be left empty when a
    # connection string is given — its Endpoint names the namespace.
    namespace: ""
    # Several namespaces, each consumed by its own client (the per-region
    # shape: one hub name, one namespace per region). Wins over `namespace`
    # when set. With connection strings give at most ONE namespace — each
    # string names its own in its Endpoint.
    namespaces: []
    # Hubs to consume; empty consumes the hub an entity-scoped connection
    # string's EntityPath names, else every hub matching ^insights-.* (the
    # names diagnostic settings create by default).
    topics: []
    # Consumer group holding the committed offsets.
    group: "$Default"
    # Secret with an Event Hubs connection string (SASL PLAIN), namespace- or
    # entity-scoped — an entity-scoped one (…;EntityPath=myhub, copied from a
    # single hub's shared access policies) also selects the hub to consume.
    # Leave name empty to authenticate with managed identity instead
    # (OAUTHBEARER via AKS workload identity — see clientId below — or IMDS).
    connectionStringSecret:
      name: ""
      key: connection-string
      # Several connection strings are several KEYS of the one Secret, each
      # its own client — which entity-scoped credentials force, one per hub
      # (a connection authenticates with exactly one credential). Wins over
      # `key` when set.
      keys: []
  # Workload-identity / user-assigned managed identity client id. When set,
  # the ServiceAccount is annotated azure.workload.identity/client-id and the
  # pod labelled azure.workload.identity/use=true, so the AKS webhook injects
  # the federated token the agent exchanges.
  clientId: ""
  tenantId: ""
  # Where a consumer group with NO committed offsets starts: end | start.
  start: end
  # Prefix for converted Azure metric names (<prefix><metricname>.<agg>).
  metricPrefix: "azure."

# Ingress NetworkPolicies for both components, restricting each pod to the
# ports the chart itself declares (the pprof port stays closed). Enabled BY
# DEFAULT: the metadata API is unauthenticated by design, which makes network
# enforcement worth having, and on a cluster with no NetworkPolicy controller
# the objects are inert, so the default costs nothing there.
#
# NOTE what these actually enforce: the ingress rules declare which PORTS are
# reachable (so undeclared ones — pprof — are closed), but they carry no `from`
# selector, so they do NOT restrict WHO may reach the declared ones. The
# metadata API's documents are object metadata the node's kubelet already has;
# if your threat model needs the API restricted to the agents, add a `from`
# selector here.
networkPolicy:
  enabled: true

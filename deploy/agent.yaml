# kubescrape-agent: per-node DaemonSet tailing containerd logs and scraping
# Prometheus targets (including the kubelet's cadvisor endpoint), exporting
# OTLP to an OpenTelemetry collector. Pod metadata comes from the kubescrape
# metadata service; the ServiceAccount exists solely to authenticate to the
# kubelet for cadvisor (nodes/metrics).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubescrape-agent
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubescrape-agent
rules:
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubescrape-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubescrape-agent
subjects:
  - kind: ServiceAccount
    name: kubescrape-agent
    namespace: monitoring
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubescrape-agent
  namespace: monitoring
  labels:
    app: kubescrape-agent
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: kubescrape-agent
  template:
    metadata:
      labels:
        app: kubescrape-agent
      # The chart stamps these (metrics.scrapeAnnotations); these manifests did
      # not, so a raw `kubectl apply -f deploy/` install opened :9090 and
      # nothing ever scraped it. kubescrape's own annotation discovery picks
      # them up, so the agents scrape this workload's runtime metrics.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: kubescrape-agent
      # The shutdown sequence is bounded but not instant: the tailer gets a
      # final sweep+flush budget, then the final log-metrics, span-metrics
      # and self-metrics exports run, then the disk buffer drains. The
      # kubelet default of 30s cuts that short during a collector outage.
      terminationGracePeriodSeconds: 60
      # Node-critical: an observability agent evicted under node pressure goes
      # missing exactly when its logs matter most.
      priorityClassName: system-node-critical
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: agent
          image: ghcr.io/johanlindvall/kubescrape:latest
          imagePullPolicy: IfNotPresent
          command: ["/kubescrape-agent"]
          args:
            - -metadata-endpoint=http://kubescrape.monitoring
            - -otlp-endpoint=otel-collector.monitoring:4317
            - -positions-file=/var/lib/kubescrape-agent/positions.json
            - -scrape-interval=30s
            # Do not tail the collector's own output (feedback loop).
            - -logs-exclude-namespaces=monitoring
            # Enables the cadvisor and node-metrics scrapes; disable
            # individual pipelines with -logs=false, -metrics=false,
            # -cadvisor=false or -node-metrics=false.
            - -kubelet-endpoint=https://$(NODE_IP):10250
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The by-name self-metadata fallback needs this: under
            # hostNetwork the hostname is the NODE's, not the pod's.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - name: http
              containerPort: 8081
          # Without these the agent's whole readiness machinery is inert on
          # this path: pods are Ready the moment the container starts, so a
          # rolling update marches across every node regardless of whether the
          # new agent can reach the metadata service — which is precisely what
          # /readyz's gates were written to prevent. The chart has them; the
          # raw manifests, which the docs tell you to `kubectl apply -f`, did
          # not.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext:
            # Container log files under /var/log/pods are root-readable only,
            # so this one workload runs as UID 0 — but reading files needs no
            # CAPABILITIES, and the default set (CHOWN, DAC_OVERRIDE, SETUID,
            # NET_RAW, ...) was being carried on the one pod that is on every
            # node in the cluster. Dropping ALL and refusing privilege
            # escalation matches what the metadata service, the events
            # singleton and the trace tier already set.
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: state
              mountPath: /var/lib/kubescrape-agent
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: state
          hostPath:
            path: /var/lib/kubescrape-agent
            type: DirectoryOrCreate

# kubescrape-agent: per-node DaemonSet tailing containerd logs and scraping
# Prometheus targets (including the kubelet's cadvisor endpoint), exporting
# OTLP to an OpenTelemetry collector. Pod metadata comes from the kubescrape
# metadata service; the ServiceAccount exists solely to authenticate to the
# kubelet — cadvisor and node metrics via nodes/metrics, /stats/summary via
# nodes/stats.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubescrape-agent
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubescrape-agent
rules:
  # The kubelet picks the subresource from the request PATH: /metrics and
  # /metrics/cadvisor authorize against nodes/metrics, /stats/* against
  # nodes/stats. Both are granted here even though -kubelet-summary below ships
  # commented out, so that uncommenting the flag is the whole change; withhold
  # nodes/stats and the reward for that one-line edit is a 403 on every node,
  # every scrape interval, under a ClusterRole that looks right. The grant is
  # read-only node telemetry either way — nodes/stats names the same pods
  # nodes/metrics does, plus their volume and PVC names.
  - apiGroups: [""]
    resources: ["nodes/metrics", "nodes/stats"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubescrape-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubescrape-agent
subjects:
  - kind: ServiceAccount
    name: kubescrape-agent
    namespace: monitoring
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubescrape-agent
  namespace: monitoring
  labels:
    app: kubescrape-agent
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: kubescrape-agent
  template:
    metadata:
      labels:
        app: kubescrape-agent
      # The chart stamps these (metrics.scrapeAnnotations); these manifests did
      # not, so a raw `kubectl apply -f deploy/` install opened :9090 and
      # nothing ever scraped it. kubescrape's own annotation discovery picks
      # them up, so the agents scrape this workload's runtime metrics.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: kubescrape-agent
      # The shutdown sequence is bounded but not instant: the tailer gets a
      # final sweep+flush budget, then the final log-metrics, span-metrics
      # and self-metrics exports run, then the disk buffer drains. The
      # kubelet default of 30s cuts that short during a collector outage.
      terminationGracePeriodSeconds: 60
      # Node-critical: an observability agent evicted under node pressure goes
      # missing exactly when its logs matter most.
      priorityClassName: system-node-critical
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # Kubernetes' own seccomp default is Unconfined, which is LOOSER than what
      # a plain container run gets, and PodSecurity's `restricted` profile
      # rejects a pod without RuntimeDefault outright — without this these pods
      # fail ADMISSION on a restricted namespace, which on a first install reads
      # as a broken manifest rather than a policy. (This agent additionally runs
      # as UID 0 and mounts hostPath /var/log, so it can never satisfy
      # `restricted` whatever this says — its namespace needs `privileged`.
      # RuntimeDefault is still the right profile for it.)
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/johanlindvall/kubescrape:latest
          imagePullPolicy: IfNotPresent
          command: ["/kubescrape-agent"]
          args:
            - -metadata-endpoint=http://kubescrape.monitoring
            - -otlp-endpoint=otel-collector.monitoring:4317
            - -positions-file=/var/lib/kubescrape-agent/positions.json
            - -scrape-interval=30s
            # Do not tail the collector's own output (feedback loop).
            - -logs-exclude-namespaces=monitoring
            # WHO MAY READ THIS NODE'S TELEMETRY FEED. The port below (:8081)
            # carries /healthz and /readyz, which the kubelet probes, and it is
            # reachable from every pod in the cluster — but three of the routes
            # on it are DATA-BEARING: /debug/otlp and /debug/otlp/ui stream,
            # verbatim, every log record, metric and span this agent exports
            # (every container log line on the node, from every namespace
            # scheduled here), and /debug/tailer enumerates every file it tails.
            #
            # Those three are NOT served openly. With no token file they answer
            # only a LOCAL connection — `kubectl port-forward` (the kubelet
            # dials 127.0.0.1 inside the pod's netns, so a port-forward arrives
            # as loopback, and reaching it already needs pods/portforward), or a
            # container in this same pod — and refuse everything else, counting
            # kubescrape_debug_refused_total{reason}. That default needs no
            # configuration and is the one to keep.
            #
            # Uncomment the flag, the mount and the volume below TOGETHER to
            # read them remotely with `Authorization: Bearer <token>` instead;
            # the file is re-read about once a minute with the previous value
            # accepted for a grace window, so rotating the Secret needs no
            # restart:
            #   kubectl -n monitoring create secret generic kubescrape-debug \
            #     --from-literal=token="$(openssl rand -hex 24)"
            #- -debug-token-file=/etc/kubescrape/debug/token
            #
            # THERE IS NO NetworkPolicy IN THESE RAW MANIFESTS. Every port this
            # DaemonSet opens — :8081 above, :9090 metrics, and :4317/:4318 if
            # you enable -ingest, which is an UNAUTHENTICATED OTLP receiver any
            # pod could push into — is reachable from every pod in the cluster.
            # The Helm chart ships ingress policies for all of them (values
            # networkPolicy.enabled, agent.debug.allowFrom, agent.ingest.allowFrom);
            # if you apply these files directly, write the equivalent yourself,
            # and tighten the unauthenticated WRITERS (the ingest ports) before
            # the readers.
            # Enables the cadvisor, node-metrics and /stats/summary scrapes;
            # disable individual pipelines with -logs=false, -metrics=false,
            # -cadvisor=false or -node-metrics=false. Empty here makes all
            # three a no-op — never scheduled rather than failing, so no
            # counter moves — which the agent warns about at startup.
            #
            # IPv6: NODE_IP is status.hostIP (below), so on an IPv6 node this
            # expands to a BARE IPv6 literal — https://fd00:10::5:10250 —
            # which net/url refuses ("invalid port after host"), and all three
            # kubelet pipelines would then fail every cycle on every node. The
            # agent normalises it, re-forming the authority with
            # net.JoinHostPort when the endpoint does not parse, so this one
            # line is correct on IPv4 and IPv6 alike. Do NOT pre-bracket it
            # here: `https://[$(NODE_IP)]:10250` renders `[10.0.0.5]` on an
            # IPv4 cluster, which Go rejects as an invalid IP-literal — one
            # static value cannot spell both families, which is why the
            # bracketing is code-side. Edit this only when the kubelet is not
            # reachable at the node's hostIP (a separate management address, a
            # name); write the host bracketed yourself then —
            # https://[fd00:10::5]:10250.
            - -kubelet-endpoint=https://$(NODE_IP):10250
            # The kubelet's THIRD endpoint, /stats/summary — JSON rather than
            # Prometheus exposition.
            #
            # What only it has: per-pod ephemeral-storage USAGE (the pod's
            # containers' writable layers plus their logs plus their on-disk
            # emptyDirs — what the eviction manager and a pod's
            # limits["ephemeral-storage"] are measured against, and what
            # neither cadvisor nor kube-state-metrics reports); per-container
            # LOG bytes, which live on nodefs outside the container's cgroup;
            # every volume the kubelet can measure, emptyDir/configMap/secret/
            # projected included, attributed to the POD that mounts it; and
            # inodes-USED, which cadvisor has no metric for at any level.
            #
            # What it restates — /metrics/cadvisor is not silent about
            # filesystems, it has container_fs_usage_bytes and its
            # _limit_bytes/_inodes_free/_inodes_total siblings keyed by DEVICE:
            # the eighteen k8s.node.{filesystem,imagefs,containerfs}.* are
            # cadvisor's root-cgroup rows again, adding the
            # nodefs/imagefs/containerfs ROLE the eviction thresholds are
            # written against; k8s.pod.process.count is the kubelet's sum of
            # its containers' cadvisor process counts, which
            # container_processes already carries; and on a PVC-backed volume
            # the six k8s.volume.* restate kubelet_volume_stats_* from the
            # -node-metrics scrape, which carry no pod label. CPU, memory,
            # network and swap are deliberately absent: cadvisor reports them
            # on the same resources, so collecting both would be the same
            # numbers twice under two names.
            #
            # Unlike -journald and -cgroup-stats below this needs no host
            # mount, only the nodes/stats grant already in the ClusterRole
            # above — so uncommenting the flag is the whole change. It is
            # commented out rather than on because the grant is what an
            # out-of-band ClusterRole is most likely to be missing, and the
            # failure is a 403 per node per scrape interval; the agent says so
            # once, naming the rule.
            #
            # Measured on a synthetic 110-pod node with two containers and two
            # measured volumes per pod: 2550 data points per scrape — 1320
            # volume, 880 container, 330 pod, 20 node. Volumes are just over
            # half of it at six points each. Trim with a drop rule under the
            # config's metrics.pipelines.summary, which sees the data-point
            # attributes (k8s.volume.name, fs.type) as labels — the toggle here
            # is all or nothing; charts/kubescrape/values.yaml has the worked
            # example.
            #- -kubelet-summary
            # The systemd journal — kubelet, containerd and the node's other
            # units, which on many distros exist NOWHERE else. Needs an image
            # built with the `journald` build tag; the default one is, while a
            # `make build TAGS=azure` binary refuses to start with this set,
            # naming the tag (docs/CONFIGURATION.md, "Build variants").
            #
            # Uncomment the flag AND the runlogjournal volume + mount below
            # TOGETHER. Persistent journals arrive through the /var/log mount,
            # but a node whose journal is volatile keeps it only under
            # /run/log/journal, which nothing else here mounts: the reader then
            # starts cleanly, blocks waiting for entries that cannot arrive and
            # exports zero records. The startup WARNING naming the empty
            # journal is the only signal — /readyz stays 200 and no counter
            # moves, an untouched counter never being exported at all.
            #- -journald
            # High-frequency cgroup sampling. The cadvisor scrape above reports
            # ONE average per -scrape-interval, so a container that spikes to 4
            # cores for 2s inside a 30s window is reported as ~0.27 cores. This
            # samples each container's cgroup every second and ships the
            # distribution — container_cpu_usage_{stddev,max,min,mean,samples}
            # and container_memory_working_set_bytes_{stddev,max,min,mean,
            # samples}, ten gauges per container per window, next to the
            # cadvisor series they explain. (`_samples` is that window's own
            # reading count: below 2 the four beside it are the previous
            # window's, one reading not being a distribution.) Measured against
            # 200 real cgroup v2 scopes, sampler-on vs sampler-off in separate
            # processes, eight pairs: 0.48% of one core (0.43-0.51%) and
            # +5.5 MiB RSS (+4.7 to +6.3) — the memory being the per-window
            # export rather than anything retained (~1.5 KiB per container),
            # and a floor: a 300s window reads +7.2 MiB.
            #
            # Uncomment the flag AND the cgroup volume + mount below TOGETHER.
            # Without the host's /sys/fs/cgroup the agent sees only its OWN
            # cgroup, finds no pod cgroups and exports nothing — the same shape
            # as the journald trap above. It says so at startup (a WARNING
            # naming the mount) and kubescrape_cgroup_containers is published at
            # 0, which is what tells "on and finding nothing" from "off".
            # cgroup v2 only, and a mixed fleet is fine: a v1 node logs an
            # ERROR naming the version and this flag, disables this pipeline
            # alone and keeps every other one — logs included — running, rather
            # than misreading v1's nanosecond counters as microseconds or
            # CrashLooping the node's log shipping over a metric.
            #
            # Only containers the metadata service can place are exported (a
            # series with no service.name has no Prometheus job and joins
            # nothing), which is also what keeps each pod's sandbox/pause
            # cgroup out of the payload: watch
            # kubescrape_cgroup_unresolved_containers, where one entry per pod
            # is normal and permanent.
            #
            # -cgroup-stats-discover-interval (default 15s) is how often the
            # container set is re-read, and it is the pipeline's BLIND SPOT: a
            # container that starts and exits between two passes is never
            # sampled and leaves no trace. Measured at the default, the share
            # with at least one exported window is 0% at a 2s lifetime, 20% at
            # 5s, 53% at 10s, 87% at 15s and 100% from 17s up — this interval
            # plus the two sampling periods a distribution needs, which is the
            # rule at any setting (at 5s, everything from 7s up). Lowering it
            # costs the METADATA SERVICE one lookup per unresolved cgroup a pass
            # (one per pod is permanent — the sandbox), not this node's CPU.
            #- -cgroup-stats
            #- -cgroup-stats-discover-interval=15s
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The by-name self-metadata fallback needs this: under
            # hostNetwork the hostname is the NODE's, not the pod's.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - name: http
              containerPort: 8081
          # Without these the agent's whole readiness machinery is inert on
          # this path: pods are Ready the moment the container starts, so a
          # rolling update marches across every node regardless of whether the
          # new agent can reach the metadata service — which is precisely what
          # /readyz's gates were written to prevent. The chart has them; the
          # raw manifests, which the docs tell you to `kubectl apply -f`, did
          # not.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext:
            # Container log files under /var/log/pods are root-readable only,
            # so this one workload runs as UID 0 — but reading files needs no
            # CAPABILITIES, and the default set (CHOWN, DAC_OVERRIDE, SETUID,
            # NET_RAW, ...) was being carried on the one pod that is on every
            # node in the cluster. Dropping ALL and refusing privilege
            # escalation matches what the metadata service, the events
            # singleton and the trace tier already set.
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: state
              mountPath: /var/lib/kubescrape-agent
            # Volatile journals (systemd Storage=volatile, or auto on a node
            # with no /var/log/journal) live ONLY here; persistent ones come in
            # through the /var/log mount above. Uncomment with -journald, which
            # otherwise has nothing to read. The chart mounts this whenever
            # agent.journald.enabled is set.
            #- name: runlogjournal
            #  mountPath: /run/log/journal
            #  readOnly: true
            # The host's cgroup hierarchy, for -cgroup-stats. Read-only: the
            # sampler only ever reads three files per container. Uncomment with
            # the flag above; the chart mounts this whenever
            # agent.cgroupStats.enabled is set.
            #- name: cgroup
            #  mountPath: /sys/fs/cgroup
            #  readOnly: true
            # The -debug-token-file Secret. Uncomment with the flag above and
            # the volume below; the path must match the flag exactly, or the
            # gate falls back to local-only without saying so.
            #- name: debug-token
            #  mountPath: /etc/kubescrape/debug
            #  readOnly: true
          # 512Mi is not arbitrary: with -ingest on, the receiver bounds itself
          # at 64 MiB of raw bodies plus ~2x that as charged decoded structure,
          # and those constants were chosen against this exact limit (see
          # decodedBudgetFactor in internal/agent/otlpingest/admit.go). Lowering
          # it removes headroom the receiver already believes it has, and
          # -ingest-grpc-max-recv-bytes scales both budgets, so raising that is
          # a memory grant — raise this in step. No CPU limit on purpose:
          # throttling a log tailer during an incident is how the incident stops
          # being observable.
          # The binary reads this limit from its own cgroup at startup and hands
          # 90% of it to the Go GC as GOMEMLIMIT (internal/cli/memlimit.go), so
          # a heap excursion becomes GC pressure instead of an OOMKill. Measured:
          # 0 kills in 16 runs of a burst that killed the unlimited arm 3 times,
          # and 0.00% cost when the limit does not bind. It follows whatever
          # number is written here — including one an operator lowers, or a VPA
          # resizes — so nothing has to be kept in step by hand. Set GOMEMLIMIT
          # in the pod env to override it; leave the CPU side alone, Go derives
          # GOMAXPROCS from a cpu limit by itself since go 1.25 (go.mod pins
          # 1.26), which is why adding one here needs no other change.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: state
          hostPath:
            path: /var/lib/kubescrape-agent
            type: DirectoryOrCreate
        # Uncomment with -journald and its mount above.
        #- name: runlogjournal
        #  hostPath:
        #    path: /run/log/journal
        #    type: DirectoryOrCreate
        # Uncomment with -cgroup-stats and its mount above. `Directory`, not
        # DirectoryOrCreate: an absent /sys/fs/cgroup is a node this feature
        # cannot work on, and creating an empty directory over it would hand the
        # agent a root that looks mounted and holds nothing.
        #- name: cgroup
        #  hostPath:
        #    path: /sys/fs/cgroup
        #    type: Directory
        # Uncomment with -debug-token-file and its mount above.
        #- name: debug-token
        #  secret:
        #    secretName: kubescrape-debug

apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubescrape
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubescrape
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "services", "nodes"]
    verbs: ["get", "list", "watch"]
  # Owner-chain metadata (metadata-only informers): statefulsets and
  # daemonsets own their pods directly, so without them those workloads'
  # labels and annotations never reach the API.
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  # Optional: ServiceMonitor discovery (-servicemonitors).
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "podmonitors"]
    verbs: ["get", "list", "watch"]
  # Optional: monitor endpoints' bearerTokenSecret serving (-scrape-auth-secrets).
  # Grants cluster-wide secret reads — enable deliberately, and note that the
  # flag also REQUIRES -scrape-auth-token-file (the service refuses to start
  # without it): /v1/scrape-auth serves Secret material and is the one route
  # that authenticates its callers, with `Authorization: Bearer <token>`.
  # - apiGroups: [""]
  #   resources: ["secrets"]
  #   verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubescrape
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubescrape
subjects:
  - kind: ServiceAccount
    name: kubescrape
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubescrape
  namespace: monitoring
  labels:
    app: kubescrape
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubescrape
  template:
    metadata:
      labels:
        app: kubescrape
      # The chart stamps these (metrics.scrapeAnnotations); these manifests did
      # not, so a raw `kubectl apply -f deploy/` install opened :9090 and
      # nothing ever scraped it — no go_*/process_* runtime metrics at all, and
      # with -self-metrics-interval=0 no kubescrape_* either. kubescrape's own
      # annotation discovery picks them up, so the agents scrape the service.
      # The sibling manifests (agent, events, servicegraph) carry the same set.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: kubescrape
      # Cluster-critical: an evicted metadata service stalls attribution
      # cluster-wide (agents block on lookups).
      priorityClassName: system-cluster-critical
      # Kubernetes' own seccomp default is Unconfined, which is LOOSER than what
      # a plain container run gets, and PodSecurity's `restricted` profile
      # rejects a pod without RuntimeDefault outright — without this these pods
      # fail ADMISSION on a restricted namespace, which on a first install reads
      # as a broken manifest rather than a policy.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubescrape
          image: ghcr.io/johanlindvall/kubescrape:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          args:
            # The API port. UNAUTHENTICATED BY DESIGN and reachable from every
            # pod in the cluster: every agent polls these /v1 routes on every
            # cycle, and what they hand out is pod/owner/namespace metadata the
            # node's own kubelet already holds — with the deploy tools'
            # copy-of-the-applied-object annotations stripped, since those carry
            # the whole spec verbatim. It also serves /healthz, /readyz and the
            # /debug index, which show the same documents. The one exception is
            # /v1/scrape-auth, which serves Secret material and is
            # bearer-authenticated; the binary refuses -scrape-auth-secrets
            # without -scrape-auth-token-file.
            #
            # THERE IS NO NetworkPolicy IN THESE RAW MANIFESTS. The Helm chart
            # ships one (networkPolicy.enabled) that at least closes the
            # undeclared ports — pprof above all, which exposes goroutine stacks
            # and heap contents. If your threat model needs the API itself
            # restricted to the agents, scope it to the DaemonSet's pods; get it
            # wrong and every agent stops resolving container metadata at once,
            # with unattributed telemetry as the only symptom.
            - -listen=:8080
            - -wait-timeout=5s
            - -cache-ttl=5m
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          # DELIBERATELY NO MEMORY LIMIT, unlike the agent and the two
          # singletons. This is the only process whose footprint scales with the
          # SIZE OF THE CLUSTER (one record per pod plus the owner/service
          # caches), and an OOMKill of this singleton stalls attribution
          # fleet-wide because every agent blocks on its lookups. The cost of
          # the trade is Burstable QoS — evictable under node pressure — which is
          # what the system-cluster-critical priorityClassName above is for. Set
          # a limit once you have measured yours; do not copy the agent's 512Mi.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubescrape
  namespace: monitoring
spec:
  selector:
    app: kubescrape
  ports:
    - name: http
      port: 80
      targetPort: http

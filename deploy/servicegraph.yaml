# The kubescrape TRACE TIER: where applications send their OTLP traces.
#
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://kubescrape-traces.monitoring.svc:4318
#   OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=http/protobuf
#
# (or :4317 with the default grpc protocol). The tier enriches each push with
# Kubernetes metadata, re-shards every span by TRACE ID so one process holds the
# whole trace, and from there emits Grafana-Tempo-compatible EDGE metrics
# (traces_service_graph_request_total and friends), derives RED metrics, applies
# head sampling and exports to the collector.
#
# Why a tier and not the DaemonSet: an EDGE needs both halves of one request, and
# those two spans are emitted by two pods that usually run on two different
# NODES, so a per-node aggregator holds half of every edge and can never pair
# anything. Re-sharding by trace id is what puts both halves in one process.
#
# A StatefulSet, not a Deployment: the ring addresses shards by their stable
# ordinal DNS names (kubescrape-servicegraph-0.kubescrape-servicegraph.
# monitoring.svc), and every shard must derive the identical ring or a trace's
# two halves land on two owners and the edge silently never forms. There is no
# volumeClaimTemplate — the pairing state is in memory by design, so the
# StatefulSet buys names, not storage. No ServiceAccount and no RBAC: this tier
# reads the Kubernetes API not at all.
#
# Apply after deploy/kubernetes.yaml (the metadata service). The Secret is
# STEP ONE and is deliberately NOT part of this file:
#
#   kubectl -n monitoring create secret generic kubescrape-service-graph \
#     --from-literal=token="$(openssl rand -hex 24)"
#   kubectl apply -f deploy/servicegraph.yaml
#
# This file used to ship that Secret with a placeholder token, which made the
# two commands above cancel each other out: the apply replaced the operator's
# random token with a literal published in this repository. The token
# authenticates the tier's INTERNAL hop (:4319) — a receiver reachable from
# every pod in the cluster, whose payloads are treated as FINAL (never
# re-enriched, never re-routed) — so anyone able to read this file could inject
# arbitrary spans into the graph. It is now absent by construction: without the
# Secret the StatefulSet stays Pending on the missing volume, which is a far
# better failure than running on a known credential. Both sides re-read the file
# periodically, so rotation needs no restart.
#
# -service-graph-shards must match .spec.replicas below: a larger count
# addresses pods that do not exist, and a push whose trace hashes there FAILS
# (the sender retries — the receiving shard holds the only copy of those spans,
# so it must not pretend otherwise).
apiVersion: v1
kind: Service
metadata:
  name: kubescrape-servicegraph
  namespace: monitoring
  labels:
    app: kubescrape-servicegraph
spec:
  # Headless: this Service exists for the per-pod DNS names it publishes, which
  # are what the ring addresses for the INTERNAL hop. A ClusterIP would
  # round-robin, which is exactly what that hop exists to undo. Applications do
  # not use this Service; they use kubescrape-traces below.
  clusterIP: None
  # Shards stay addressable while they start and during a rolling restart;
  # otherwise the internal hops that hash there fail outright rather than being
  # delayed.
  publishNotReadyAddresses: true
  selector:
    app: kubescrape-servicegraph
  ports:
    - name: service-graph
      port: 4319
      targetPort: service-graph
---
# The APPLICATION-facing Service. A normal ClusterIP, deliberately: round-robin
# is fine here, because the shard that receives a push is not the shard that has
# to own the trace — the internal hop fixes that.
#
# UNAUTHENTICATED. Any pod that can reach it may push arbitrary OTLP spans, with
# no credential; enrichment stamps the SENDER's Kubernetes identity where it can
# resolve one, but a sender can still name any service.name it likes and the
# volume it pushes costs this tier and the collector. That is the same bargain
# every unauthenticated in-cluster OTLP collector makes. Add a NetworkPolicy if
# the pod network is not trusted.
apiVersion: v1
kind: Service
metadata:
  name: kubescrape-traces
  namespace: monitoring
  labels:
    app: kubescrape-servicegraph
spec:
  type: ClusterIP
  selector:
    app: kubescrape-servicegraph
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kubescrape-servicegraph
  namespace: monitoring
  labels:
    app: kubescrape-servicegraph
spec:
  serviceName: kubescrape-servicegraph
  # Must equal -service-graph-shards below: the count IS part of the ring's
  # definition.
  replicas: 2
  # Shards are independent; ordered startup would delay the last one's traces
  # for no benefit.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kubescrape-servicegraph
  template:
    metadata:
      labels:
        app: kubescrape-servicegraph
      # The chart stamps these (metrics.scrapeAnnotations); these manifests did
      # not, so a raw `kubectl apply -f deploy/` install opened :9090 and
      # nothing ever scraped it. kubescrape's own annotation discovery picks
      # them up, so the agents scrape this workload's runtime metrics.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      # No ServiceAccount and nothing here reads the Kubernetes API, so the
      # default account's token is not projected into a pod whose
      # application-facing ports take pushes from every pod in the cluster.
      automountServiceAccountToken: false
      # Room for the final service-graph and self-metrics exports.
      terminationGracePeriodSeconds: 60
      # Kubernetes' own seccomp default is Unconfined, which is LOOSER than what
      # a plain container run gets, and PodSecurity's `restricted` profile
      # rejects a pod without RuntimeDefault outright — without this these pods
      # fail ADMISSION on a restricted namespace, which on a first install reads
      # as a broken manifest rather than a policy.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: servicegraph
          image: ghcr.io/johanlindvall/kubescrape:latest
          imagePullPolicy: IfNotPresent
          command: ["/kubescrape-agent"]
          args:
            - -service-graph
            # The INTERNAL receiver: spans a sibling shard re-sharded to us.
            # Deliberately not 4317/4318 — those are this same workload's
            # APPLICATION ports, and an internal hop addressed there would be
            # re-enriched (against a peer that is now a kubescrape pod) and
            # re-sharded on every pass.
            - -service-graph-listen=:4319
            - -service-graph-token-file=/etc/kubescrape/service-graph/token
            # The application-facing trace listeners, behind the ClusterIP
            # Service above.
            - -service-graph-ingest
            - -service-graph-ingest-grpc=:4317
            - -service-graph-ingest-http=:4318
            # The ring, for the internal hop. The endpoint is the GOVERNING
            # HEADLESS Service, from which each shard's stable per-pod name is
            # derived; $POD_NAME below tells this pod which of them it is, so
            # the traces it already owns take no hop at all.
            - -service-graph-shards=2
            - -service-graph-endpoint=kubescrape-servicegraph.monitoring.svc:4319
            # Every per-node pipeline off: this tier does traces and nothing
            # else. -ingest is the DaemonSet's LOGS-AND-METRICS receiver.
            - -logs=false
            - -metrics=false
            - -cadvisor=false
            - -node-metrics=false
            - -ingest=false
            - -metadata-endpoint=http://kubescrape.monitoring
            - -otlp-endpoint=otel-collector.monitoring:4317
            - -listen=:8081
            # The port above also serves /debug/otlp and /debug/otlp/ui, which
            # on a shard stream the TRACES this tier exports — the whole
            # cluster's, since every instrumented application pushes here. With
            # no token file those two answer only a LOCAL connection (`kubectl
            # port-forward`, or a container in this pod) and refuse everything
            # else, counting kubescrape_debug_refused_total{reason}. Keep that
            # default; uncomment the flag, the mount and the volume below
            # TOGETHER to read them remotely with a bearer token instead
            # (re-read about once a minute, previous value accepted for a grace
            # window, so rotation needs no restart):
            #   kubectl -n monitoring create secret generic kubescrape-debug \
            #     --from-literal=token="$(openssl rand -hex 24)"
            #- -debug-token-file=/etc/kubescrape/debug/token
            #
            # THERE IS NO NetworkPolicy IN THESE RAW MANIFESTS, and this
            # workload is the one where that matters most: :4317/:4318 are
            # UNAUTHENTICATED trace receivers any pod in the cluster may push
            # arbitrary spans into, and :4319 is the internal shard hop, whose
            # only legitimate clients are the sibling shards (it is guarded by
            # the bearer token above, not by the network). The Helm chart ships
            # a four-rule ingress policy covering exactly that split
            # (networkPolicy.enabled, serviceGraph.ingest.allowFrom,
            # agent.debug.allowFrom); if you apply these files directly, write
            # the equivalent yourself and scope the trace ports first.
          env:
            # The agent binary wants a node name for its own self-metrics
            # identity; an edge never carries it (an edge is a property of the
            # two services, not of the shard that paired them).
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            # THIS SHARD'S NAME IN THE RING (-service-graph-shard-name defaults
            # to it): a StatefulSet pod's name is <sts>-<ordinal>, which is what
            # the ring derives its tokens from. It is also the identity for the
            # self-metadata by-name fallback.
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: service-graph-token
              mountPath: /etc/kubescrape/service-graph
              readOnly: true
            # Uncomment with -debug-token-file above and the volume below; the
            # mount path must match the flag exactly, or the gate falls back to
            # local-only without saying so.
            #- name: debug-token
            #  mountPath: /etc/kubescrape/debug
            #  readOnly: true
          ports:
            - name: http
              containerPort: 8081
            - name: service-graph
              containerPort: 4319
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            # Memory scales with the pairing store (maxItems) and the edge
            # series count (maxCardinality), not with the cluster's span rate;
            # CPU scales with the received span rate over the shard count.
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: service-graph-token
          secret:
            secretName: kubescrape-service-graph
        # Uncomment with -debug-token-file and its mount above.
        #- name: debug-token
        #  secret:
        #    secretName: kubescrape-debug

# OpenTelemetry collector (contrib distribution) for testing the
# kubescrape-agent pipeline: receives OTLP gRPC for all THREE signals, prints
# summaries via the debug exporter, and — the part assertions depend on —
# writes every received payload verbatim through the FILE exporter.
#
# The debug exporter only prints summaries ("N log records"), which can prove
# that data arrived but never that an ATTRIBUTE HAS THE RIGHT VALUE. hack/e2e.sh
# and hack/chaos/* need the latter, so the file exporter captures the payloads
# and a busybox `reader` sidecar exists purely to `cat` them back out: the
# collector image is distroless, so `kubectl exec`/`kubectl cp` into it fail
# (no shell, no tar).
#
# Its own internal metrics (port 8888) are annotated for scraping, closing the
# loop: the agent scrapes the collector and exports the result back to it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: monitoring
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    exporters:
      debug:
        verbosity: normal
      # One file per signal, read back by the `reader` sidecar. Rotation keeps
      # a long run from filling the node; assertions grab a snapshot and look
      # for what they expect rather than counting the whole history.
      file/logs:
        path: /data/logs.json
        rotation: {max_megabytes: 200, max_backups: 2}
      file/metrics:
        path: /data/metrics.json
        rotation: {max_megabytes: 200, max_backups: 2}
      file/traces:
        path: /data/traces.json
        rotation: {max_megabytes: 200, max_backups: 2}
    service:
      # Bind the internal metrics endpoint to 0.0.0.0 explicitly. Since
      # collector v0.111 the telemetry.UseLocalHostAsDefaultMetricsAddress
      # feature gate is ON by default, so this endpoint listens on 127.0.0.1 —
      # the prometheus.io/port: "8888" annotation above then pointed the agents
      # at a port nothing outside the container could reach, and the fixture's
      # claim to "close the loop" by scraping the collector's own metrics
      # quietly did nothing.
      telemetry:
        metrics:
          address: 0.0.0.0:8888
      pipelines:
        logs:
          receivers: [otlp]
          exporters: [debug, file/logs]
        metrics:
          receivers: [otlp]
          exporters: [debug, file/metrics]
        # The trace tier (-service-graph) exports spans, so the fixture has to
        # accept them or its pushes fail and the tier's own health suffers.
        traces:
          receivers: [otlp]
          exporters: [debug, file/traces]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: monitoring
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.115.1
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: metrics
              containerPort: 8888
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
            - name: data
              mountPath: /data
        # Exists only so assertions can read the captured payloads: the
        # collector image is distroless (no shell, no tar), so exec/cp into it
        # fail. `kubectl exec -c reader -- cat /data/<signal>.json` works.
        - name: reader
          image: busybox:1.36
          command: ["/bin/sh", "-c", "sleep infinity"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc

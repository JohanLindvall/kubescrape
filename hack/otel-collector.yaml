# OpenTelemetry collector (contrib distribution) for testing the
# kubescrape-agent pipeline: receives OTLP gRPC for all THREE signals, prints
# summaries via the debug exporter, and — the part assertions depend on —
# writes every received payload verbatim through the FILE exporter.
#
# At `verbosity: normal` (set below, and load-bearing — see the note there) the
# debug exporter prints a summary line per push ("N log records", "N data
# points") AND one line per item: a log record's BODY plus its record
# attributes, a metric data point's NAME plus its data-point attributes and
# value. What it never prints at any verbosity below `detailed` is the RESOURCE
# — normal's marshalers walk ResourceLogs/ResourceMetrics only to reach the
# leaves and never render resource attributes — so stdout can prove that data
# arrived, and that a metric NAME or a log BODY is present, but never that a
# RESOURCE ATTRIBUTE HAS THE RIGHT VALUE. hack/e2e.sh and hack/chaos/* need the
# latter, so the file exporter captures the payloads verbatim and a busybox
# `reader` sidecar exists purely to `cat` them back out: the collector image is
# distroless, so `kubectl exec`/`kubectl cp` into it fail (no shell, no tar).
#
# Its own internal metrics (port 8888) are annotated for scraping, closing the
# loop: the agent scrapes the collector and exports the result back to it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: monitoring
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    exporters:
      debug:
        # LOAD-BEARING, not cosmetic. `basic` returns from pushMetrics/pushLogs
        # BEFORE the marshaler runs, leaving only the summary line — and
        # hack/e2e.sh's negotiating_scraped() greps collector stdout for the
        # metric NAME `e2e_classic_latency_seconds`, which only the
        # per-data-point line carries. Lowering this to trim kind disk usage
        # makes that assertion time out at its full 180s budget with no hint
        # why. `detailed` goes the other way: it prints whole payloads, and the
        # kubelet rotates the collector's own stdout within seconds
        # (hack/kind-config.yaml sets containerLogMaxSize: 1Mi).
        verbosity: normal
      # One file per signal, read back by the `reader` sidecar. Rotation keeps
      # a long run from filling the node; assertions grab a snapshot and look
      # for what they expect rather than counting the whole history.
      file/logs:
        path: /data/logs.json
        rotation: {max_megabytes: 200, max_backups: 2}
      file/metrics:
        path: /data/metrics.json
        rotation: {max_megabytes: 200, max_backups: 2}
      file/traces:
        path: /data/traces.json
        rotation: {max_megabytes: 200, max_backups: 2}
    service:
      # Bind the internal metrics endpoint to 0.0.0.0 explicitly. Since
      # collector v0.111 the telemetry.UseLocalHostAsDefaultMetricsAddress
      # feature gate is ON by default, so this endpoint listens on 127.0.0.1 —
      # the prometheus.io/port: "8888" annotation above then pointed the agents
      # at a port nothing outside the container could reach, and the fixture's
      # claim to "close the loop" by scraping the collector's own metrics
      # quietly did nothing.
      telemetry:
        metrics:
          address: 0.0.0.0:8888
      pipelines:
        logs:
          receivers: [otlp]
          exporters: [debug, file/logs]
        metrics:
          receivers: [otlp]
          exporters: [debug, file/metrics]
        # The trace tier (-service-graph) exports spans, so the fixture has to
        # accept them or its pushes fail and the tier's own health suffers.
        traces:
          receivers: [otlp]
          exporters: [debug, file/traces]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: monitoring
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.115.1
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: metrics
              containerPort: 8888
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
            - name: data
              mountPath: /data
        # Exists only so assertions can read the captured payloads: the
        # collector image is distroless (no shell, no tar), so exec/cp into it
        # fail. `kubectl exec -c reader -- cat /data/<signal>.json` works.
        - name: reader
          image: busybox:1.36
          command: ["/bin/sh", "-c", "sleep infinity"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc

---
# Source: kubescrape/templates/agent.yaml
# Agent ingress. The selector must be the AGENT's label: this policy used to
# select `app: <release>` — the metadata SERVICE's pods — so enabling it left
# the DaemonSet with no policy at all while silently narrowing the service to a
# single port. Every port declared on the container belongs here, or the chart
# would firewall off an endpoint it opened in the same file; the metrics port in
# particular is the one metrics.scrapeAnnotations tells Prometheus to scrape.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubescrape-agent
  namespace: monitoring
  labels: 
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: kubescrape
    helm.sh/chart: kubescrape-0.1.0
spec:
  podSelector:
    matchLabels:
      app: kubescrape-agent
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8081
        - port: 9090
        - port: 4317
        - port: 4318
---
# Source: kubescrape/templates/events.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubescrape-events
  namespace: monitoring
  labels: 
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: kubescrape
    helm.sh/chart: kubescrape-0.1.0
spec:
  podSelector:
    matchLabels:
      app: kubescrape-events
  policyTypes: [Ingress]
  ingress:
    - ports:
        # Health/readiness (the kubelet probes these) and, when enabled, the
        # scrape port. Nothing else is served.
        - port: 8081
        - port: 9090
---
# Source: kubescrape/templates/service.yaml
# Metadata-service ingress. The agent fleet polls the API port and, when
# metrics.scrapeAnnotations is on, a scraper reaches the metrics port — so both
# belong here. The pprof port is deliberately NOT opened: it exposes goroutine
# stacks and heap contents, and is the one listener the chart wants firewalled.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubescrape
  namespace: monitoring
  labels: 
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: kubescrape
    helm.sh/chart: kubescrape-0.1.0
spec:
  podSelector:
    matchLabels:
      app: kubescrape
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
        - port: 9090
---
# Source: kubescrape/templates/servicegraph.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubescrape-servicegraph
  namespace: monitoring
  labels: 
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: kubescrape
    helm.sh/chart: kubescrape-0.1.0
spec:
  podSelector:
    matchLabels:
      app: kubescrape-servicegraph
  policyTypes: [Ingress]
  ingress:
    # THREE rules, because these ports have three different audiences and a
    # NetworkPolicy rule's `from` and `ports` apply TOGETHER. They used to be one
    # rule, so `serviceGraph.ingest.allowFrom` — whose documented job is to scope
    # who may push TRACES — silently scoped the internal shard port along with
    # them and BROKE THE RING at this chart's own default replicas: 2. Shard 0
    # could no longer reach shard 1, every re-shard hop failed the application's
    # push, and half of every cross-node edge simply never formed, for a reason
    # nothing in values.yaml mentions.
    #
    # 1. Health/readiness and the scrape port. Deliberately unscoped: the
    #    kubelet's probes come from the node, and Prometheus discovery comes
    #    from wherever it runs. Undeclared ports (pprof) stay closed.
    - ports:
        - port: 8081
        - port: 9090
    # 2. The INTERNAL receiver. Its only legitimate clients are the sibling
    #    shards, so it is scoped to this tier's own pods REGARDLESS of
    #    allowFrom — the ring is not optional — and it is authenticated by the
    #    shared bearer token, which is what actually guards it.
    - ports:
        - port: 4319
      from:
        - podSelector:
            matchLabels:
              app: kubescrape-servicegraph
    # 3. The application OTLP trace ports — the ones allowFrom is FOR.
    #
    # WHAT THEY EXPOSE, stated plainly: any pod that can reach them can push
    # arbitrary OTLP spans into this cluster's traces, with no credential.
    # Enrichment stamps the SENDER's Kubernetes identity where it can resolve
    # one, so a forged span is attributable to the pod that sent it rather than
    # to whatever it claims — but a sender can still emit spans naming any
    # service.name it likes, and the cost of the volume it pushes is the tier's
    # and the collector's. That is the same bargain every unauthenticated OTLP
    # collector in a cluster makes; narrow it with allowFrom if the pod network
    # is not trusted. EMPTY MEANS ANY POD MAY PUSH TRACES.
    - ports:
        - port: 4317
        - port: 4318
---

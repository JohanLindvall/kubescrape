# Source: kubescrape/templates/agent.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubescrape-agent
  namespace: monitoring
  labels:
    app: kubescrape-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: kubescrape
    helm.sh/chart: kubescrape-0.1.0
spec:
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app: kubescrape-agent
  template:
    metadata:
      labels:
        app: kubescrape-agent
      annotations:
        checksum/config: f89226f5b2aefe355feea2a8f5915960ad610c5ba4dc2e894a0e1e38af09d72b
        # kubescrape discovers prometheus.io/* annotations itself, so the agent
        # scrapes its own runtime metrics like any other pod.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: kubescrape-agent
      # The shutdown sequence is bounded but not instant: producers stop
      # under a budget, then the final log-metrics, span-metrics and
      # self-metrics exports run, then the disk buffer drains. The kubelet
      # default of 30s cuts that short during a collector outage.
      terminationGracePeriodSeconds: 60
      priorityClassName: system-node-critical
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
                - arm64
      containers:
        - name: agent
          image: ghcr.io/johanlindvall/kubescrape:latest
          imagePullPolicy: IfNotPresent
          command: ["/kubescrape-agent"]
          args:
            - -metadata-endpoint=http://kubescrape.monitoring
            # /v1/scrape-auth returns Secret values and is authenticated. The
            # flag, the mount and the service's own token all key off this one
            # value so the two sides cannot drift apart.
            - -scrape-auth-token-file=/etc/kubescrape/scrape-auth/token
            - -listen=:8081
            - -self-metrics-interval=1m
            - -otlp-endpoint=otel-collector.monitoring:4317
            - -otlp-protocol=grpc
            - -otlp-compression=gzip
            - -otlp-compression-level=0
            - -otlp-insecure=true
            - -otlp-tls-insecure-skip-verify=false
            - -otlp-timeout=15s
            - -otlp-retry-attempts=3
            - -otlp-retry-backoff=1s
            - -logs=true
            - -metrics=true
            - -cadvisor=true
            - -cadvisor-rollups=true
            - -node-metrics=true
            - -kubelet-endpoint=https://$(NODE_IP):10250
            - -kubelet-insecure-tls=true
            - -positions-file=/var/lib/kubescrape-agent/positions.json
            - -enrich=true
            - -logs-file-attributes=false
            - -logs-rate-limit=0.5
            - -logs-rate-burst=1.5
            - -logs-rate-drop=false
            - -logs-unknown-files=auto
            - -logs-idle-close=30s
            - -buffer-dir=/var/lib/kubescrape-agent/buffer
            - -buffer-max-bytes=1073741824
            - -config=/etc/kubescrape/config/config.yaml
            - -logs-metrics-interval=10s
            - -logs-metrics-max-bytes=1048576
            - -logs-metrics-name-prefix=acme_
            - -logs-watch=true
            - -logs-poll-interval=500ms
            - -logs-fingerprint-bytes=1024
            - -logs-multiline=true
            - -logs-exclude-namespaces=kube-system,monitoring
            - -scrape-interval=30s
            - -scrape-exemplars=false
            - -scrape-health-metrics=true
            - -journald
            - -journald-batch-size=1024
            - -journald-max-batch-bytes=1048576
            - -journald-flush-interval=2s
            - -ingest
            - -ingest-grpc-endpoint=:4317
            - -ingest-http-endpoint=:4318
            - -ingest-metrics-mode=auto
            - -ingest-peer-ip-fallback=true
            - -ingest-grpc-max-recv-bytes=41943040
            - -log-level=info
            - -metrics-listen=:9090
            - -log-format=text
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The by-name self-metadata fallback needs this: under
            # hostNetwork the hostname is the NODE's, not the pod's.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          securityContext:
            # UID 0 because container log files under /var/log/pods are
            # root-readable only. Reading them needs no CAPABILITIES, though,
            # and the default set was being carried on the one workload that
            # runs on every node — the siblings all drop ALL already.
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8081
            - name: metrics
              containerPort: 9090
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          volumeMounts:
            - name: config
              mountPath: /etc/kubescrape/config
              readOnly: true
            - name: scrape-auth
              mountPath: /etc/kubescrape/scrape-auth
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: state
              mountPath: /var/lib/kubescrape-agent
            # Volatile journals; persistent ones live under the /var/log
            # mount above.
            - name: runlogjournal
              mountPath: /run/log/journal
              readOnly: true
          resources: 
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: state
          hostPath:
            path: /var/lib/kubescrape-agent
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: kubescrape-agent-config
        - name: scrape-auth
          secret:
            secretName: kubescrape-scrape-auth
        - name: runlogjournal
          hostPath:
            path: /run/log/journal
            type: DirectoryOrCreate
---
# Source: kubescrape/templates/events.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubescrape-events
  namespace: monitoring
  labels:
    app: kubescrape-events
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: kubescrape
    helm.sh/chart: kubescrape-0.1.0
spec:
  # One replica is the norm; leader election makes >1 safe (and makes a
  # rolling update's overlap safe even at 1).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kubescrape-events
  template:
    metadata:
      labels:
        app: kubescrape-events
        azure.workload.identity/use: "true"
      annotations:
        checksum/config: f89226f5b2aefe355feea2a8f5915960ad610c5ba4dc2e894a0e1e38af09d72b
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: kubescrape-events
      # The shutdown sequence is bounded but not instant: producers stop
      # under a budget, then the final log-metrics, span-metrics and
      # self-metrics exports run, then the disk buffer drains. The kubelet
      # default of 30s cuts that short during a collector outage.
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: events
          image: ghcr.io/johanlindvall/kubescrape:latest
          imagePullPolicy: IfNotPresent
          command: ["/kubescrape-agent"]
          args:
            # Every per-node pipeline off: this replica only runs the
            # cluster-scoped ones.
            - -logs=false
            - -metrics=false
            - -cadvisor=false
            - -node-metrics=false
            - -journald=false
            - -ingest=false
            - -metadata-endpoint=http://kubescrape.monitoring
            - -listen=:8081
            - -self-metrics-interval=1m
            - -events
            - -events-lease=kubescrape-cluster-leader
            - -events-position-configmap=kubescrape-events-position
            - -events-start=auto
            - -events-batch-size=512
            - -events-flush-interval=2s
            - -events-position-interval=10s
            - -azure-diagnostics
            - -azure-eventhub-namespace=golden.servicebus.windows.net
            - -azure-eventhub-group=$Default
            - -azure-client-id=00000000-0000-0000-0000-000000000000
            - -azure-start=end
            - -azure-metric-prefix=azure.
            - -otlp-endpoint=otel-collector.monitoring:4317
            - -otlp-protocol=grpc
            - -otlp-compression=gzip
            - -otlp-compression-level=0
            - -otlp-insecure=true
            - -otlp-tls-insecure-skip-verify=false
            - -otlp-timeout=15s
            - -otlp-retry-attempts=3
            - -otlp-retry-backoff=1s
            - -enrich=true
            - -config=/etc/kubescrape/config/config.yaml
            - -logs-metrics-interval=10s

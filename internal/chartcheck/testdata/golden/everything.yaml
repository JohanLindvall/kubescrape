# Source: kubescrape/templates/service.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubescrape
  labels: 
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: kubescrape
    helm.sh/chart: kubescrape-0.1.0
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "services", "nodes"]
    verbs: ["get", "list", "watch"]
  # StatefulSets and DaemonSets own their pods directly (no ReplicaSet in
  # between), so their metadata informers are what gives those workloads'
  # pods owner labels and annotations at all.
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  # Optional: ServiceMonitor discovery (-servicemonitors).
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "podmonitors"]
    verbs: ["get", "list", "watch"]
  # Serving monitor endpoints' bearerTokenSecret to agents. The flag, this
  # rule and both sides' token all key off service.scrapeAuthSecrets, so they
  # cannot drift apart.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]

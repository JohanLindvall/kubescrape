# Source: kubescrape/templates/agent.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubescrape-agent-config
  namespace: monitoring
  labels: 
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: kubescrape
    helm.sh/chart: kubescrape-0.1.0
data:
  config.yaml: |
    logs:
      sources:
      - containerd: true
        include:
        - /var/log/containers/*.log
        name: containers
      - include:
        - /var/log/host/azdo-diag/**/*.log
        name: azdo
        pathAttributes:
        - regexp: /azdo-diag/(?P<azdo_agent>[^/]+)/
    resourceAttributes:
      attributes:
        team: '{{ with .Pod }}{{ index .Labels "team" }}{{ end }}'
      static:
        k8s.cluster.name: golden-test

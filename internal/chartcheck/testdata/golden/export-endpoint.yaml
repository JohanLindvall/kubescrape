apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubescrape
  namespace: monitoring
  labels:
    app: kubescrape
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: kubescrape
    helm.sh/chart: kubescrape-0.1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubescrape
  template:
    metadata:
      labels:
        app: kubescrape
      annotations:
        # kubescrape's own agents discover prometheus.io/* annotations, so the
        # service's runtime metrics are scraped like any other pod's.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: kubescrape
      priorityClassName: system-cluster-critical
      containers:
        - name: kubescrape
          image: ghcr.io/johanlindvall/kubescrape:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          args:
            - -listen=:8080
            - -self-metrics-interval=1m
            - -wait-timeout=5s
            - -cache-ttl=5m
            - -servicemonitors=false
            - -otlp-endpoint=otel-collector.monitoring:4317
            - -otlp-protocol=grpc
            - -otlp-compression=gzip
            - -otlp-compression-level=0
            - -otlp-insecure=true
            - -otlp-tls-insecure-skip-verify=false
            - -otlp-timeout=15s
            - -log-level=info
            - -metrics-listen=:9090
            - -log-format=text
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources: 
            requests:
              cpu: 50m
              memory: 128Mi

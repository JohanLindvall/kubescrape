# Source: kubescrape/templates/agent.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubescrape-agent
  namespace: monitoring
  labels:
    app: kubescrape-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: kubescrape
    helm.sh/chart: kubescrape-0.1.0
spec:
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app: kubescrape-agent
  template:
    metadata:
      labels:
        app: kubescrape-agent
      annotations:
        checksum/config: 44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a
        # kubescrape discovers prometheus.io/* annotations itself, so the agent
        # scrapes its own runtime metrics like any other pod.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: kubescrape-agent
      # The shutdown sequence is bounded but not instant: producers stop
      # under a budget, then the final log-metrics, span-metrics and
      # self-metrics exports run, then the disk buffer drains. The kubelet
      # default of 30s cuts that short during a collector outage.
      terminationGracePeriodSeconds: 60
      priorityClassName: system-node-critical
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/johanlindvall/kubescrape:latest
          imagePullPolicy: IfNotPresent
          command: ["/kubescrape-agent"]
          args:
            - -metadata-endpoint=http://kubescrape.monitoring
            - -listen=:8081
            - -self-metrics-interval=1m
            - -otlp-endpoint=otel.grafana.net:443
            - -otlp-protocol=grpc
            - -otlp-compression=gzip
            - -otlp-compression-level=0
            - -otlp-insecure=false
            - -otlp-tls-insecure-skip-verify=false
            - -otlp-timeout=15s
            - -otlp-retry-attempts=3
            - -otlp-retry-backoff=1s
            - -logs=true
            - -metrics=true
            - -cadvisor=true
            - -cadvisor-rollups=true
            - -node-metrics=true
            - -kubelet-summary=false
            - -kubelet-endpoint=https://$(NODE_IP):10250
            - -kubelet-insecure-tls=true
            - -positions-file=/var/lib/kubescrape-agent/positions.json
            - -enrich=true
            - -logs-file-attributes=false
            - -logs-unknown-files=auto
            - -logs-idle-close=0
            - -logs-watch=true
            - -logs-poll-interval=500ms
            - -logs-fingerprint-bytes=1024
            - -logs-multiline=true
            - -logs-exclude-namespaces=monitoring
            - -scrape-interval=30s
            - -scrape-exemplars=false
            - -scrape-health-metrics=true
            - -log-level=info
            - -metrics-listen=:9090
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The by-name self-metadata fallback needs this: under
            # hostNetwork the hostname is the NODE's, not the pod's.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          securityContext:
            # UID 0 because container log files under /var/log/pods are
            # root-readable only. Reading them needs no CAPABILITIES, though,
            # and the default set was being carried on the one workload that
            # runs on every node — the siblings all drop ALL already.
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8081
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: state
              mountPath: /var/lib/kubescrape-agent
          resources: 
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: state
          hostPath:
            path: /var/lib/kubescrape-agent
            type: DirectoryOrCreate
---
# Source: kubescrape/templates/service.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubescrape
  namespace: monitoring
  labels:
    app: kubescrape
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: kubescrape
    helm.sh/chart: kubescrape-0.1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubescrape
  template:
    metadata:
      labels:
        app: kubescrape
      annotations:
        # kubescrape's own agents discover prometheus.io/* annotations, so the
        # service's runtime metrics are scraped like any other pod's.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: kubescrape
      priorityClassName: system-cluster-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubescrape
          image: ghcr.io/johanlindvall/kubescrape:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          args:
            - -listen=:8080
            - -self-metrics-interval=1m
            - -wait-timeout=5s
            - -cache-ttl=5m
            - -servicemonitors=false
            - -otlp-endpoint=otel-collector.monitoring:4317
            - -otlp-protocol=grpc
            - -otlp-compression=gzip
            - -otlp-compression-level=0
            - -otlp-insecure=true
            - -otlp-tls-insecure-skip-verify=false
            - -otlp-timeout=15s
            - -log-level=info
            - -metrics-listen=:9090
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources: 
            requests:
              cpu: 50m
              memory: 128Mi

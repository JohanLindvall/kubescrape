# Source: kubescrape/templates/agent.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubescrape-agent
  labels: 
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: kubescrape
    helm.sh/chart: kubescrape-0.1.0
rules:
  # Solely for authenticating to the kubelet. The kubelet picks the subresource
  # from the request PATH: /metrics and /metrics/cadvisor authorize against
  # nodes/metrics, /stats/* against nodes/stats, so agent.kubeletSummary needs
  # the second one. Both are granted UNCONDITIONALLY rather than behind the
  # value: enabling the scrape through agent.extraArgs — which people do —
  # would otherwise 403 on every node, every scrape interval, with the
  # ClusterRole looking correct. The grant is read-only node telemetry either
  # way; nodes/stats names the same pods nodes/metrics does, plus their volume
  # and PVC names.
  - apiGroups: [""]
    resources: ["nodes/metrics", "nodes/stats"]
    verbs: ["get"]
---
# Source: kubescrape/templates/service.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubescrape
  labels: 
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: kubescrape
    helm.sh/chart: kubescrape-0.1.0
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "services", "nodes"]
    verbs: ["get", "list", "watch"]
  # StatefulSets and DaemonSets own their pods directly (no ReplicaSet in
  # between), so their metadata informers are what gives those workloads'
  # pods owner labels and annotations at all.
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  # Optional: ServiceMonitor discovery (-servicemonitors).
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "podmonitors"]
    verbs: ["get", "list", "watch"]

# Every optional workload and surface on at once: the agent extras (ingest with
# a raised gRPC cap, journald, disk buffer, explicit exclude list, config file
# with sources + static attrs), the service's monitors + scrape-auth (token
# PINNED — lookup() sees no cluster and the fixture must not reach
# randAlphaNum), the trace tier with span metrics, and the events+azure
# singleton sharing one Deployment.
agent:
  bufferDir: /var/lib/kubescrape-agent/buffer
  # A DURATION here, deliberately: -logs-idle-close is a flag.Duration, and the
  # schema typed it integer-only — "30s" failed helm validation while a bare 30
  # passed helm and crashed the agent at flag parse. This pins the string form
  # rendering verbatim into the flag.
  logsIdleClose: "30s"
  logsExcludeNamespaces: [kube-system, monitoring]
  # FRACTIONAL, deliberately: both -logs-rate-* are flag.Float64 and a rate
  # below one line/second is a supported throttle, but values.schema.json typed
  # them integer-only, so helm refused the value before rendering anything.
  logsRateLimit: 0.5
  logsRateBurst: 1.5
  # NON-EMPTY scheduling maps, deliberately: the schema declared these as an
  # object with empty `properties` and additionalProperties:false, which rejects
  # EVERY key — the four values the templates render verbatim were unusable and
  # no fixture rendered one. These are what fails if the schema re-tightens.
  nodeSelector:
    kubernetes.io/os: linux
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values: [amd64, arm64]
  # Agent-WIDE log-metrics knobs: they must reach the events/Azure singleton
  # too, which runs the same logMetrics set over the same mounted config — the
  # prefix rendering on the DaemonSet alone split one rule into two names.
  logsMetrics:
    interval: 10s
    maxBytes: "1048576"
    namePrefix: acme_
  staticAttrs:
    k8s.cluster.name: golden-test
  journald:
    enabled: true
  # The flag block AND the read-only /sys/fs/cgroup mount must render together
  # — internal/manifestcheck asserts they are offered in the same state, and
  # this is what pins that the chart actually emits both. A non-default interval
  # and an explicit root, so the two optional args are covered too.
  #
  # The explicit root is the interesting half: it is the ONE value that used to
  # render a flag the mount contradicted (-cgroup-stats-root=/host/sys/fs/cgroup
  # against a mountPath hardcoded to /sys/fs/cgroup), so the shipped chart
  # CrashLooped on it and this fixture froze the contradiction into a golden
  # file. The golden now has the mount and the flag naming the same path.
  cgroupStats:
    enabled: true
    interval: 500ms
    # Deliberately NOT the 15s default: a template that hardcoded the discovery
    # cadence would render identically to the default and this golden would not
    # notice.
    discoverInterval: 30s
    root: /host/sys/fs/cgroup
  # The kubelet's /stats/summary scrape, the one pipeline toggle whose default
  # is off. Every other fixture pins the rendered `-kubelet-summary=false`; this
  # is what pins the true arm, and what would notice a template that gated the
  # flag on the value instead of rendering it either way — which would leave an
  # agent enabling it through extraArgs with no way to turn it back off.
  kubeletSummary: true
  ingest:
    enabled: true
    grpcMaxRecvBytes: 41943040
    peerIpFallback: true
  config:
    resourceAttributes:
      attributes:
        team: '{{ with .Pod }}{{ index .Labels "team" }}{{ end }}'
    logs:
      sources:
        - name: containers
          include: ["/var/log/containers/*.log"]
          containerd: true
        - name: azdo
          include: ["/var/log/host/azdo-diag/**/*.log"]
          pathAttributes:
            - regexp: '/azdo-diag/(?P<azdo_agent>[^/]+)/'
service:
  serviceMonitors: true
  scrapeAuthSecrets: true
  scrapeAuthToken:
    value: golden-pinned-token
serviceGraph:
  enabled: true
  replicas: 2
  spanMetrics: true
  nodeSelector:
    kubernetes.io/os: linux
events:
  enabled: true
  nodeSelector:
    kubernetes.io/os: linux
azure:
  enabled: true
  eventhub:
    namespace: golden.servicebus.windows.net
  clientId: 00000000-0000-0000-0000-000000000000
